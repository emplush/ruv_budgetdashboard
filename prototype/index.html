/* R+V Design: Tokens und Schriften aus dem Design-System "R+V Design". */

:root {
  --primary: #001957;
  --white: #ffffff;
  --orange-light: #f79506;
  --orange-dark: #eb6504;
  --mint-light: #00dcdc;
  --mint-dark: #109da8;
  --sand: #fff4e0;
  --grey-1: #f5f5f5;
  --grey-2: #ececec;
  --grey-3: #c7c7c7;
  --grey-4: #888888;
  --grey-5: #707070;
  --red-1: #ff4c4c;
  --red-2: #ff8484;
  --green-ok: #759a03;
  --green-ok-light: #8ebc27;

  --font-sans: "RuV Sans", Arial, Helvetica, sans-serif;
  --font-slab: "RuV Slab", Georgia, serif;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --radius-base: 4px;
  --zebra: #fff4e0; --hover: #f5f5f5; --footer: #f5f5f5;
}

:root,
[data-theme="hell"] {
  --surface: var(--white);
  --surface-soft: var(--sand);
  --ink: var(--primary);
  --ink-muted: var(--grey-5);
  --highlight: var(--orange-dark);
  --interactive: var(--mint-dark);
  --interactive-hover: var(--mint-light);
  --on-interactive: var(--primary);
  --link: #167b8a;
  --border: var(--grey-3);
  --error: var(--red-1);
  --success: var(--green-ok);
}

[data-theme="dunkel"] {
  --surface: var(--primary);
  --surface-soft: var(--primary);
  --ink: var(--white);
  --ink-muted: #bdc4d4;
  --highlight: var(--orange-light);
  --interactive: var(--mint-light);
  --interactive-hover: #2ee6e6;
  --on-interactive: var(--primary);
  --link: #5befef;
  --border: #a2abc2;
  --error: var(--red-2);
  --success: var(--green-ok-light);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--ink);
  font: 400 16px/24px var(--font-sans);
}

a { color: var(--link); }
h1, h2, h3, p { margin: 0; }
strong { font-weight: 900; }

:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }

.skip-link {
  position: absolute; left: var(--space-3); top: -100px; z-index: 10;
  background: var(--white); color: var(--primary); padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-base); font-weight: 700;
}
.skip-link:focus { top: var(--space-2); }

/* Typografie */
.topline { font: 700 18px/1.3 var(--font-slab); color: var(--highlight); margin-bottom: var(--space-2); }
.headline { font: 700 36px/1.15 var(--font-sans); margin-bottom: var(--space-4); }
.headline-s { font: 700 20px/1.2 var(--font-sans); margin-bottom: var(--space-3); }
.copy-s, .hint { font: 400 14px/21px var(--font-sans); }
.hint { color: var(--ink-muted); }

/* Kopfbereich */
.app-header { background: var(--surface); color: var(--ink); }
.app-header__inner {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
}
.app-header__brand { display: flex; align-items: center; gap: var(--space-4); color: var(--ink); text-decoration: none; }
.app-header__logo { height: 44px; width: auto; display: block; }
.app-header__title { font: 700 20px/1.2 var(--font-sans); padding-left: var(--space-4); border-left: 2px solid var(--highlight); }
.app-header__user { display: flex; flex-direction: column; align-items: flex-end; font: 400 14px/21px var(--font-sans); }
.app-header__role { font-weight: 700; color: var(--highlight); }

/* Horizontale Navigation unter dem Kopfbereich */
.app-nav { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.app-nav__list {
  display: flex; align-items: stretch; margin: 0; padding: 0 var(--space-3); list-style: none;
  overflow-x: auto; scrollbar-width: thin;
}
.app-nav__list li { display: flex; }
.app-nav__list form { display: flex; margin: 0; }
.app-nav__end { margin-left: auto; }
.app-nav__link {
  display: flex; align-items: center; white-space: nowrap;
  padding: 14px var(--space-3); background: none; border: 0; border-bottom: 4px solid transparent;
  color: var(--ink); font: 700 16px/1 var(--font-sans); text-decoration: none; cursor: pointer;
}
.app-nav__link:hover { background: var(--hover); }
.app-nav__link.is-active { border-bottom-color: var(--interactive); }
.app-nav__link:focus-visible { outline-offset: -3px; }

/* Inhaltsbereich in voller Breite */
.content { flex: 1; width: 100%; padding: var(--space-5) var(--space-4) var(--space-6); }
.page > * + * { margin-top: var(--space-4); }
.page > .topline + .headline { margin-top: 0; }
.page > .topline { margin-bottom: 0; }
.page > .headline { margin-bottom: 0; }

.app-footer { padding: var(--space-3) var(--space-4); background: var(--footer); color: var(--ink-muted); font: 400 14px/21px var(--font-sans); }

/* Karten */
.card { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-base); padding: var(--space-4); }
.card--soft { background: var(--surface-soft); }
.card .headline-s { margin-bottom: var(--space-3); }
.card--form { max-width: 720px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); align-items: start; }
.grid-2 .card--form { max-width: none; }

.facts { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-4); margin: 0 0 var(--space-3); }
.facts dt { font-weight: 700; }
.facts dd { margin: 0; }

/* Anmeldung */
.auth { display: flex; justify-content: center; padding-top: var(--space-5); }
.auth__card { width: 100%; max-width: 480px; }
.auth__card > * + * { margin-top: var(--space-3); }
.auth__card > .headline { margin-bottom: 0; }

/* Formulare */
.form { display: flex; flex-direction: column; gap: var(--space-3); }
.form--row { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.field label { font: 700 16px/1.2 var(--font-sans); }
.field--check { gap: var(--space-1); }
.field--check label, .check { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 400; }
input[type="text"], input[type="password"], input:not([type]), input[inputmode] {
  padding: 12px; border: 1px solid var(--ink-muted); border-radius: var(--radius-base);
  background: var(--surface); color: var(--ink); font: 400 16px/1.2 var(--font-sans); width: 100%;
}
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--mint-dark); margin: 0; }
.form--row .field { width: 200px; }
.form--row .field--check { width: auto; }

.rules { margin: 0; padding-left: var(--space-4); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px;
  border: 2px solid transparent; border-radius: var(--radius-base);
  font: 700 16px/1 var(--font-sans); text-decoration: none; cursor: pointer; transition: background .15s;
}
.btn--primary { background: var(--interactive); color: var(--on-interactive); }
.btn--primary:hover { background: var(--interactive-hover); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--surface); }
.btn--small { padding: 8px 12px; font-size: 14px; }
.actions { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }

/* Meldungen: Farbe nur als Rahmen, Text immer in Tinte mit Stichwort */
.alert { border: 2px solid var(--border); border-radius: var(--radius-base); padding: var(--space-3); max-width: 720px; background: var(--surface); }
.alert--error { border-color: var(--error); }
.alert--ok { border-color: var(--success); }
.alert--info { border-color: var(--mint-dark); }

/* Tabellen */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-base); }
.table { width: 100%; border-collapse: collapse; font: 400 14px/21px var(--font-sans); }
.table thead th { background: var(--primary); color: var(--white); text-align: left; font-weight: 700; padding: 12px var(--space-3); white-space: nowrap; }
.table tbody tr:nth-child(even) { background: var(--zebra); }
.table td, .table tbody th { padding: 10px var(--space-3); text-align: left; vertical-align: middle; }
.table tbody th { font-weight: 700; white-space: nowrap; }
.cell-input { width: 100%; min-width: 110px; padding: 8px; font-size: 14px; }
.cell-input--wide { min-width: 220px; }
.inline-form { display: flex; gap: var(--space-2); flex-wrap: wrap; margin: 0; }
.badge { display: inline-block; padding: 2px 8px; border: 2px solid var(--error); border-radius: var(--radius-base); font-weight: 700; margin-left: var(--space-1); }
td .hint { display: block; }

@media (max-width: 720px) {
  .app-header__inner { flex-direction: column; align-items: flex-start; gap: var(--space-2); }
  .app-header__user { align-items: flex-start; }

<script>
(function () {

  var BLOCK = ["passwort", "password", "12test34", "qwertz", "qwerty", "123456", "abcdef", "ruv", "budget"];
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  /* ---------- Krypto (PBKDF2 im Browser, nur Demo) ---------- */
  var b64 = function (u) { return btoa(String.fromCharCode.apply(null, u)); };
  var unb64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  async function derive(pw, salt) {
    var k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: 100000 }, k, 256));
  }
  async function hashPw(pw) { var salt = crypto.getRandomValues(new Uint8Array(16)); return b64(salt) + "." + b64(await derive(pw, salt)); }
  async function verifyPw(pw, stored) {
    if (!stored) { await derive(pw, new Uint8Array(16)); return false; }
    var p = stored.split("."), h = await derive(pw, unb64(p[0])), e = unb64(p[1]), d = 0;
    for (var i = 0; i < e.length; i++) d |= h[i] ^ e[i];
    return d === 0;
  }

  /* ---------- Daten ---------- */
  var mem = null;
  function load() {
    try { var s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
    return mem;
  }
  function save() { mem = data; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  async function seed() {
    return {
      title: "Budget-Dashboard 2.0", head: null, years: [], items: [],
      admin: { number: ADMIN, hash: await hashPw("12test34"), failed: 0, lock: 0, must: true },
      ccs: []
    };
  }
  var data = null, session = null, route = "login", pending = null, flash = null, errors = [], draft = {}, loginNum = "";
  var find = function (n) { return n === ADMIN ? data.admin : data.ccs.find(function (c) { return c.number === n; }); };
  var roleOf = function (n) { return n === ADMIN ? "Admin" : n === data.head ? "Abteilungsleiter" : "Gruppenleiter"; };
  var roleLabel = function (r) { return r === "Admin" ? "Administration" : r === "Abteilungsleiter" ? "Abteilungsleitung" : "Gruppenleitung"; };

  function policy(pw, num) {
    var e = [];
    if (pw.length < 12) e.push("Das Passwort braucht mindestens 12 Zeichen.");
    if (pw.length > 128) e.push("Das Passwort darf höchstens 128 Zeichen haben.");
    if (!/[A-ZÄÖÜ]/.test(pw)) e.push("Das Passwort braucht mindestens einen Großbuchstaben.");
    if (!/[a-zäöüß]/.test(pw)) e.push("Das Passwort braucht mindestens einen Kleinbuchstaben.");
    if (!/[0-9]/.test(pw)) e.push("Das Passwort braucht mindestens eine Ziffer.");
    if (!/[^\p{L}\p{N}\s]/u.test(pw)) e.push("Das Passwort braucht mindestens ein Sonderzeichen.");
    if (num && pw.indexOf(num) >= 0) e.push("Das Passwort darf Deine Kostenstelle nicht enthalten.");
    var l = pw.toLowerCase();
    if (BLOCK.some(function (b) { return l.indexOf(b) >= 0; })) e.push("Das Passwort enthält ein zu bekanntes Muster.");
    return e;
  }

  var MANUALS = {"nutzer": {"title": "Handbuch für Nutzende", "short": "Nutzende", "html": "<p class=\"meta\">Version 1.3 · Stand Oktober 2026<\/p>\n<p>Dieses Handbuch erklärt Dir, wie Du Dich im Budget-Dashboard 2.0 anmeldest, Deine Angaben pflegst und Dein Passwort änderst. Es richtet sich an alle Nutzenden mit einer Kostenstelle.<\/p>\n\n<nav class=\"toc\" aria-label=\"Inhalt\">\n  <p>Inhalt<\/p>\n  <ol>\n    <li><a href=\"#anmelden\">Anmelden<\/a><\/li>\n    <li><a href=\"#erste-anmeldung\">Erste Anmeldung und Passwort setzen<\/a><\/li>\n    <li><a href=\"#navigation\">Die Navigation<\/a><\/li>\n    <li><a href=\"#budgetplan\">Budgetplan<\/a><\/li>\n    <li><a href=\"#profil\">Profil: Angaben und Passwort<\/a><\/li>\n    <li><a href=\"#abmelden\">Abmelden und Sitzung<\/a><\/li>\n    <li><a href=\"#probleme\">Wenn etwas nicht klappt<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<h2 id=\"anmelden\">1. Anmelden<\/h2>\n<p>Öffne die Adresse der Anwendung in Deinem Browser. Auf der Anmeldeseite gibst Du zwei Dinge ein:<\/p>\n<ul>\n  <li><strong>Kostenstelle:<\/strong> eine Zahl mit genau 8 Ziffern.<\/li>\n  <li><strong>Passwort:<\/strong> Dein persönliches Passwort.<\/li>\n<\/ul>\n<p>Klicke dann auf <strong>Jetzt anmelden<\/strong>. Du landest auf Deinem Dashboard.<\/p>\n<div class=\"callout\">\n  <p>Du kannst Dich nur anmelden, wenn Deine Kostenstelle freigegeben ist. Die Freigabe übernimmt die Administration.<\/p>\n<\/div>\n\n<h2 id=\"erste-anmeldung\">2. Erste Anmeldung und Passwort setzen<\/h2>\n<p>Meldest Du Dich zum ersten Mal an, hast Du noch kein Passwort. Gehe so vor:<\/p>\n<ol>\n  <li>Gib Deine Kostenstelle ein und lass das Feld <strong>Passwort<\/strong> leer.<\/li>\n  <li>Klicke auf <strong>Jetzt anmelden<\/strong>. Es erscheint der Dialog <strong>Bitte setze ein Passwort<\/strong>.<\/li>\n  <li>Gib Dein neues Passwort zweimal ein und klicke auf <strong>Passwort speichern<\/strong>.<\/li>\n<\/ol>\n<p>Danach bist Du angemeldet. Bei jeder weiteren Anmeldung brauchst Du dieses Passwort.<\/p>\n<h3>Regeln für das Passwort<\/h3>\n<ul>\n  <li>mindestens 12 Zeichen<\/li>\n  <li>Groß- und Kleinbuchstaben<\/li>\n  <li>mindestens eine Ziffer<\/li>\n  <li>mindestens ein Sonderzeichen, zum Beispiel <kbd>#<\/kbd>, <kbd>-<\/kbd> oder <kbd>!<\/kbd><\/li>\n  <li>ohne Deine Kostenstelle und ohne bekannte Muster wie „Passwort“<\/li>\n<\/ul>\n<div class=\"callout callout--warn\">\n  <p>Gib Dein Passwort an niemanden weiter. Wenn Du es vergessen hast, bittest Du die Administration, es zu löschen. Danach setzt Du ein neues.<\/p>\n<\/div>\n\n<h2 id=\"navigation\">3. Die Navigation<\/h2>\n<p>Unter dem Kopfbereich verläuft die Navigation waagerecht. Der Inhalt nutzt die ganze Breite.<\/p>\n<table>\n  <thead><tr><th>Menüpunkt<\/th><th>Wofür er da ist<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard<\/td><td>Startseite mit Deinen Angaben: Kostenstelle, Org-Einheit, Gruppe und Rolle.<\/td><\/tr>\n    <tr><td>Budgetplan<\/td><td>Budgetpositionen eintragen und freigegebene Positionen ansehen (siehe Abschnitt 4).<\/td><\/tr>\n    <tr><td>Jahresbudget<\/td><td>Dieser Bereich wird demnächst gefüllt.<\/td><\/tr>\n    <tr><td>Profil<\/td><td>Deine Angaben und Dein Passwort ändern.<\/td><\/tr>\n    <tr><td>Abmelden<\/td><td>Sitzung beenden.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<p>Oben rechts im Kopfbereich findest Du die Schaltfläche <strong>Handbuch<\/strong>. Dort kannst Du dieses Handbuch auch als PDF herunterladen.<\/p>\n\n<h2 id=\"budgetplan\">4. Budgetplan<\/h2>\n<p>Im Menüpunkt <strong>Budgetplan<\/strong> trägst Du als Gruppenleitung Budgetpositionen für ein Kalenderjahr ein und siehst die freigegebenen Positionen. Der Budgetplan hat drei Unterpunkte, die Du oben im Bereich auswählst:<\/p>\n<table>\n  <thead><tr><th>Unterpunkt<\/th><th>Was Du dort findest<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Aktueller Stand<\/td><td>Alle freigegebenen Budgetpositionen Deiner Gruppe für ein Kalenderjahr, mit Summe. Du schaltest zwischen den Jahren um.<\/td><\/tr>\n    <tr><td>Gesamtbudgetplan<\/td><td>Eine Übersicht über alle Kalenderjahre: ob das Jahr freigeschaltet ist, wie viele Positionen freigegeben sind, die freigegebene Summe und die wartenden Beträge.<\/td><\/tr>\n    <tr><td>Eingabe Budgetposition<\/td><td>Neue Budgetpositionen eintragen und den Status Deiner Anfragen verfolgen.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"callout\">\n  <p>Du kannst nur für Kalenderjahre Positionen eintragen, die die Abteilungsleitung freigeschaltet hat. Ist noch kein Jahr freigeschaltet, siehst Du einen Hinweis und das Formular fehlt.<\/p>\n<\/div>\n\n<h3>Budgetposition eintragen und zur Freigabe senden<\/h3>\n<ol>\n  <li>Öffne <strong>Budgetplan<\/strong> und dann <strong>Eingabe Budgetposition<\/strong>.<\/li>\n  <li>Gib die <strong>Bezeichnung<\/strong> ein, höchstens 100 Zeichen.<\/li>\n  <li>Gib den <strong>Betrag in EUR (Brutto)<\/strong> ein, zum Beispiel <kbd>1.234,56<\/kbd>. Der Betrag hat bis zu 2 Stellen hinter dem Komma und gilt brutto. Er wird immer mit 2 Nachkommastellen angezeigt.<\/li>\n  <li>Wähle das <strong>Kalenderjahr<\/strong>. Zur Auswahl stehen die freigeschalteten Jahre.<\/li>\n  <li>Schreibe den <strong>Hinweistext zur Freigabe<\/strong>. Begründe kurz, wofür Du das Budget brauchst. Der Text ist ein Pflichtfeld, höchstens 500 Zeichen.<\/li>\n  <li>Klicke auf <strong>Freigabe<\/strong>. Die Position geht an die Abteilungsleitung und erscheint dort unter „Freigaben“.<\/li>\n<\/ol>\n\n<h3>Status der Freigaben<\/h3>\n<p>Unter dem Formular zeigt die Tabelle <strong>Status der Freigaben<\/strong> alle Anfragen, die noch nicht genehmigt sind:<\/p>\n<ul>\n  <li><strong>Warten …<\/strong>: Die Abteilungsleitung hat noch nicht entschieden.<\/li>\n  <li><strong>Abgelehnt<\/strong>: Klicke auf das Wort „Abgelehnt“. Ein Fenster zeigt den Grund der Ablehnung. Wurde kein Grund eingegeben, steht dort „Es wurde keine Begründung eingegeben.“<\/li>\n  <li><strong>Genehmigt<\/strong>: Die Position verschwindet aus der Tabelle. Du findest sie unter <strong>Aktueller Stand<\/strong> im jeweiligen Kalenderjahr.<\/li>\n<\/ul>\n<h3>Einträge löschen<\/h3>\n<p>Mit dem <strong>Papierkorb<\/strong> am Ende der Zeile löschst Du einen Eintrag aus der Tabelle.<\/p>\n<ul>\n  <li>Hat der Eintrag den Status „Warten …“, verschwindet er auch bei der Abteilungsleitung. Die Anfrage ist damit zurückgezogen.<\/li>\n  <li>Hat der Eintrag den Status „Abgelehnt“, verschwindet er nur aus Deiner Tabelle.<\/li>\n  <li>Freigegebene Positionen lassen sich nicht löschen.<\/li>\n<\/ul>\n<h3>Freigegebene Positionen ansehen<\/h3>\n<p>Unter <strong>Aktueller Stand<\/strong> wählst Du oben das Kalenderjahr. Die Tabelle zeigt Bezeichnung, Betrag (Brutto), Hinweis und Freigabedatum. Darunter steht die Summe des Jahres.<\/p>\n\n<h2 id=\"profil\">5. Profil: Angaben und Passwort<\/h2>\n<h3>Org-Einheit und Gruppe ändern<\/h3>\n<ol>\n  <li>Öffne <strong>Profil<\/strong>.<\/li>\n  <li>Im Abschnitt <strong>Meine Angaben<\/strong> trägst Du Deine <strong>Org-Einheit<\/strong> (höchstens 11 Zeichen) und Deine <strong>Gruppe<\/strong> (höchstens 30 Zeichen) ein.<\/li>\n  <li>Klicke auf <strong>Angaben speichern<\/strong>. Du siehst die Meldung „Gespeichert“.<\/li>\n<\/ol>\n<p>Deine <strong>Kostenstelle<\/strong> steht dort ebenfalls, lässt sich aber nicht ändern.<\/p>\n<h3>Passwort ändern<\/h3>\n<ol>\n  <li>Gib im Abschnitt <strong>Passwort ändern<\/strong> zuerst Dein aktuelles Passwort ein.<\/li>\n  <li>Gib das neue Passwort zweimal ein. Es muss die Regeln aus Abschnitt 2 erfüllen und sich vom aktuellen unterscheiden.<\/li>\n  <li>Klicke auf <strong>Passwort speichern<\/strong>.<\/li>\n<\/ol>\n<p>Andere Sitzungen mit Deiner Kostenstelle werden dabei beendet. Du selbst bleibst angemeldet.<\/p>\n\n<h2 id=\"abmelden\">6. Abmelden und Sitzung<\/h2>\n<p>Klicke in der Navigation auf <strong>Abmelden<\/strong>, wenn Du fertig bist. Das ist besonders wichtig an gemeinsam genutzten Rechnern.<\/p>\n<p>Nach 30 Minuten ohne Aktivität meldet Dich die Anwendung automatisch ab. Du meldest Dich dann einfach neu an.<\/p>\n\n<h2 id=\"probleme\">7. Wenn etwas nicht klappt<\/h2>\n<table>\n  <thead><tr><th>Meldung oder Situation<\/th><th>Was Du tun kannst<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>„Kostenstelle oder Passwort stimmt nicht“<\/td><td>Prüfe die 8 Ziffern und das Passwort. Achte auf Groß- und Kleinschreibung. Ist Deine Kostenstelle noch nicht freigegeben, wende Dich an die Administration.<\/td><\/tr>\n    <tr><td>„Die Anmeldung ist gesperrt“<\/td><td>Nach 5 Fehlversuchen ist Deine Kostenstelle 15 Minuten gesperrt. Warte kurz und versuche es dann erneut.<\/td><\/tr>\n    <tr><td>Passwort vergessen<\/td><td>Bitte die Administration, Dein Passwort zu löschen. Danach meldest Du Dich wie bei der ersten Anmeldung an und setzt ein neues.<\/td><\/tr>\n    <tr><td>„Dieser Bereich ist für Dich nicht freigegeben“<\/td><td>Der Bereich gehört zu einer anderen Rolle, zum Beispiel zur Abteilungsleitung.<\/td><\/tr>\n    <tr><td>Im Formular fehlt das Kalenderjahr oder die Meldung „Kalenderjahr nicht freigeschaltet“ erscheint<\/td><td>Die Abteilungsleitung hat das Jahr noch nicht freigeschaltet. Frage dort nach.<\/td><\/tr>\n    <tr><td>Meldung zum Betrag<\/td><td>Gib den Betrag größer als 0 mit höchstens 2 Nachkommastellen ein, zum Beispiel 1.234,56.<\/td><\/tr>\n    <tr><td>Org-Einheit oder Gruppe zu lang<\/td><td>Kürze den Text auf 11 beziehungsweise 30 Zeichen.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n", "file": "Budget-Dashboard-Handbuch-Nutzende.pdf"}, "abteilungsleitung": {"title": "Handbuch für die Abteilungsleitung", "short": "Abteilungsleitung", "html": "<p class=\"meta\">Version 1.3 · Stand Oktober 2026<\/p>\n<p>Dieses Handbuch richtet sich an die Abteilungsleitung. Alles, was für alle Nutzenden gilt, steht im Handbuch für Nutzende. Hier findest Du, was für die Abteilungsleitung zusätzlich gilt.<\/p>\n\n<nav class=\"toc\" aria-label=\"Inhalt\">\n  <p>Inhalt<\/p>\n  <ol>\n    <li><a href=\"#rolle\">Deine Rolle<\/a><\/li>\n    <li><a href=\"#navigation\">Die Navigation der Abteilungsleitung<\/a><\/li>\n    <li><a href=\"#budgetfreigaben\">Budgetfreigaben: Freischaltung und Freigaben<\/a><\/li>\n    <li><a href=\"#budgetplan\">Budgetplan: Einsicht für die Abteilungsleitung<\/a><\/li>\n    <li><a href=\"#upload\">Upload<\/a><\/li>\n    <li><a href=\"#rechte\">Rechte erhalten und verlieren<\/a><\/li>\n    <li><a href=\"#gemeinsam\">Was Du wie alle Nutzenden tust<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<h2 id=\"rolle\">1. Deine Rolle<\/h2>\n<p>Die Administration legt fest, welche Kostenstelle die Rechte der Abteilungsleitung hat. Es gibt genau eine solche Kostenstelle. Die Anmeldung läuft wie bei allen anderen: mit Kostenstelle und Passwort. Oben rechts im Kopfbereich steht Deine Rolle als <strong>Abteilungsleitung<\/strong>.<\/p>\n\n<h2 id=\"navigation\">2. Die Navigation der Abteilungsleitung<\/h2>\n<p>Du siehst alle Menüpunkte der Nutzenden. Hinter <strong>Jahresbudget<\/strong> stehen zusätzlich zwei Punkte:<\/p>\n<table>\n  <thead><tr><th>Menüpunkt<\/th><th>Wer ihn sieht<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard, Budgetplan, Jahresbudget<\/td><td>alle Nutzenden<\/td><\/tr>\n    <tr><td><strong>Budgetfreigaben<\/strong> mit den Unterpunkten Freigaben und Freischaltung Budgetpläne<\/td><td>nur die Abteilungsleitung<\/td><\/tr>\n    <tr><td><strong>Upload<\/strong><\/td><td>nur die Abteilungsleitung<\/td><\/tr>\n    <tr><td>Profil, Abmelden<\/td><td>alle Nutzenden<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 id=\"budgetfreigaben\">3. Budgetfreigaben<\/h2>\n<p>Der Menüpunkt <strong>Budgetfreigaben<\/strong> hat zwei Unterpunkte: <strong>Freigaben<\/strong> und <strong>Freischaltung Budgetpläne<\/strong>.<\/p>\n\n<h3 id=\"freischaltung\">Freischaltung Budgetpläne<\/h3>\n<p>Hier bestimmst Du, für welche Kalenderjahre die Gruppenleitungen Budgetpositionen einreichen können. Zur Wahl stehen 2026, 2027 und 2028.<\/p>\n<ol>\n  <li>Öffne <strong>Budgetfreigaben<\/strong> und dann <strong>Freischaltung Budgetpläne<\/strong>.<\/li>\n  <li>Klicke beim gewünschten Jahr auf <strong>Aktivieren<\/strong>. Der Status wechselt auf „Aktiviert“.<\/li>\n  <li>Mit <strong>Deaktivieren<\/strong> sperrst Du das Jahr wieder.<\/li>\n<\/ol>\n<p>Das gilt sofort. Die Gruppenleitungen sehen nur aktivierte Jahre im Formular und im Budgetplan. Positionen, die schon eingereicht wurden, bleiben erhalten.<\/p>\n\n<h3 id=\"freigaben\">Freigaben<\/h3>\n<p>Unter <strong>Freigaben<\/strong> siehst Du alle Budgetpositionen, die auf Deine Entscheidung warten. Die Tabelle zeigt Kostenstelle, Gruppe, Bezeichnung, Betrag (Brutto), Kalenderjahr, den Hinweis der Gruppenleitung und das Datum der Anfrage.<\/p>\n<ul>\n  <li><strong>Freigabe:<\/strong> Ein Klick genehmigt die Position. Sie verschwindet aus Deiner Liste und erscheint im Budgetplan der Gruppe.<\/li>\n  <li><strong>Ablehnung:<\/strong> Es öffnet sich ein Fenster. Gib dort optional einen <strong>Grund<\/strong> ein und bestätige mit <strong>OK<\/strong>. Mit <strong>Abbrechen<\/strong> schließt Du das Fenster ohne Entscheidung.<\/li>\n<\/ul>\n<div class=\"callout\">\n  <p>Die Gruppenleitung sieht den Status „Abgelehnt“ und kann Deinen Grund in einem Fenster lesen. Hast Du keinen Grund eingegeben, erscheint dort ein Hinweis, dass keine Begründung eingegeben wurde. Eine Entscheidung lässt sich nicht zurücknehmen.<\/p>\n<\/div>\n<p>Zieht eine Gruppenleitung eine wartende Anfrage zurück, verschwindet sie auch aus Deiner Liste.<\/p>\n\n<h2 id=\"budgetplan\">4. Budgetplan: Einsicht für die Abteilungsleitung<\/h2>\n<p>Auch Du hast den Menüpunkt <strong>Budgetplan<\/strong>. Du trägst dort keine Positionen ein, siehst aber die Zahlen aller Gruppen:<\/p>\n<ul>\n  <li><strong>Aktueller Stand:<\/strong> Alle freigegebenen Positionen aller Gruppen für ein Kalenderjahr, mit Kostenstelle und Gruppe sowie der Summe. Du schaltest zwischen den freigeschalteten Jahren um.<\/li>\n  <li><strong>Gesamtbudgetplan:<\/strong> Je Kalenderjahr der Status der Freischaltung, die Zahl und Summe der freigegebenen Positionen sowie die wartenden Beträge. Darunter stehen die freigegebenen Beträge je Gruppe und Jahr.<\/li>\n<\/ul>\n\n<h2 id=\"upload\">5. Upload<\/h2>\n<p>Hier lädst Du später Daten hoch. Dieser Bereich wird demnächst gefüllt.<\/p>\n\n<h2 id=\"rechte\">6. Rechte erhalten und verlieren<\/h2>\n<ul>\n  <li>Die Administration kann die Abteilungsleitung auf eine andere Kostenstelle übertragen oder die Rechte entziehen.<\/li>\n  <li>Werden Dir die Rechte entzogen, endet Deine Sitzung. Du meldest Dich neu an und siehst dann die Navigation der Nutzenden.<\/li>\n  <li>Wurde Deine Kostenstelle gesperrt oder entfernt, kannst Du Dich nicht mehr anmelden.<\/li>\n<\/ul>\n<div class=\"callout\">\n  <p>Wenn Du die Rolle abgeben möchtest, wende Dich an die Administration. Du kannst die Rechte nicht selbst übertragen.<\/p>\n<\/div>\n\n<h2 id=\"gemeinsam\">7. Was Du wie alle Nutzenden tust<\/h2>\n<p>Diese Aufgaben sind im Handbuch für Nutzende beschrieben. Du findest es über die Schaltfläche <strong>Handbuch<\/strong> im Kopfbereich.<\/p>\n<ul>\n  <li>Erste Anmeldung und Passwort setzen<\/li>\n  <li>Org-Einheit und Gruppe im Profil ändern<\/li>\n  <li>Passwort ändern<\/li>\n  <li>Abmelden und automatische Abmeldung nach 30 Minuten<\/li>\n  <li>Hilfe bei Sperre oder vergessenem Passwort<\/li>\n<\/ul>\n", "file": "Budget-Dashboard-Handbuch-Abteilungsleitung.pdf"}, "admin": {"title": "Handbuch für die Administration", "short": "Administration", "html": "<p class=\"meta\">Version 1.3 · Stand Oktober 2026<\/p>\n<p>Dieses Handbuch richtet sich an die Administration. Du verwaltest die Kostenstellen, bestimmst die Abteilungsleitung, pflegst die Einstellungen und kannst Testdaten importieren.<\/p>\n\n<nav class=\"toc\" aria-label=\"Inhalt\">\n  <p>Inhalt<\/p>\n  <ol>\n    <li><a href=\"#anmelden\">Anmelden und erstes Passwort<\/a><\/li>\n    <li><a href=\"#navigation\">Die Navigation<\/a><\/li>\n    <li><a href=\"#dashboard\">Dashboard<\/a><\/li>\n    <li><a href=\"#kostenstellen\">Kostenstellen verwalten<\/a><\/li>\n    <li><a href=\"#einstellungen\">Einstellungen<\/a><\/li>\n    <li><a href=\"#testdaten\">Testdaten<\/a><\/li>\n    <li><a href=\"#betrieb\">Sicherheit und Betrieb<\/a><\/li>\n    <li><a href=\"#probleme\">Wenn etwas nicht klappt<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<h2 id=\"anmelden\">1. Anmelden und erstes Passwort<\/h2>\n<p>Die Administration hat die feste Kostenstelle <strong>00000000<\/strong>. Das Standardpasswort ist <code>12test34<\/code>.<\/p>\n<div class=\"callout callout--warn\">\n  <p>Solange das Standardpasswort aktiv ist, zeigt jede Admin-Seite den Hinweis „Es ist noch das Standardpasswort aktiv“. Ändere das Passwort sofort unter <strong>Einstellungen<\/strong>.<\/p>\n<\/div>\n\n<h2 id=\"navigation\">2. Die Navigation<\/h2>\n<p>Die Administration hat eine eigene Navigation:<\/p>\n<table>\n  <thead><tr><th>Menüpunkt<\/th><th>Wofür er da ist<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard<\/td><td>Kennzahlen zu den Kostenstellen und die aktuelle Abteilungsleitung.<\/td><\/tr>\n    <tr><td>Kostenstellen<\/td><td>Kostenstellen anlegen, bearbeiten, freigeben und entfernen.<\/td><\/tr>\n    <tr><td>Einstellungen<\/td><td>Titel der Anwendung, Admin-Passwort und Testdaten.<\/td><\/tr>\n    <tr><td>Abmelden<\/td><td>Sitzung beenden.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 id=\"dashboard\">3. Dashboard<\/h2>\n<p>Das Dashboard zeigt vier Kennzahlen:<\/p>\n<ul>\n  <li><strong>Kostenstellen insgesamt:<\/strong> alle angelegten Kostenstellen.<\/li>\n  <li><strong>Dürfen sich anmelden:<\/strong> die freigegebenen Kostenstellen.<\/li>\n  <li><strong>Warten auf ein Passwort:<\/strong> freigegebene Kostenstellen ohne Passwort. Sie melden sich zum ersten Mal an.<\/li>\n  <li><strong>Gerade gesperrt:<\/strong> Kostenstellen mit aktiver Sperre nach Fehlversuchen.<\/li>\n<\/ul>\n<p>Darunter steht die Kostenstelle mit den Rechten der Abteilungsleitung.<\/p>\n\n<h2 id=\"kostenstellen\">4. Kostenstellen verwalten<\/h2>\n<p>Zum Budgetplan hast Du keinen Zugriff. Die Abteilungsleitung schaltet die Kalenderjahre frei, die Gruppenleitungen tragen ihre Budgetpositionen ein. Deine Aufgabe ist es, die Kostenstellen und die Rolle der Abteilungsleitung zu pflegen.<\/p>\n<h3>Kostenstelle anlegen<\/h3>\n<ol>\n  <li>Öffne <strong>Kostenstellen<\/strong>.<\/li>\n  <li>Trage im Abschnitt <strong>Neue Kostenstelle anlegen<\/strong> die <strong>Kostenstelle<\/strong> ein: genau 8 Ziffern. Die Nummer 00000000 ist für Dich reserviert.<\/li>\n  <li>Ergänze optional die <strong>Org-Einheit<\/strong> (höchstens 11 Zeichen) und die <strong>Gruppe<\/strong> (höchstens 30 Zeichen).<\/li>\n  <li>Lass <strong>Darf sich anmelden<\/strong> angehakt, wenn die Kostenstelle sich sofort anmelden soll.<\/li>\n  <li>Hake <strong>Abteilungsleitung<\/strong> an, wenn die Kostenstelle diese Rechte erhalten soll.<\/li>\n  <li>Klicke auf <strong>Kostenstelle anlegen<\/strong>.<\/li>\n<\/ol>\n<p>Die neue Kostenstelle hat noch kein Passwort. Beim ersten Anmelden mit leerem Passwortfeld setzt die Person ihr Passwort selbst.<\/p>\n\n<h3>Kostenstelle bearbeiten<\/h3>\n<p>In der Tabelle <strong>Alle Kostenstellen<\/strong> änderst Du Org-Einheit, Gruppe und die Freigabe direkt in der Zeile. Klicke danach auf <strong>Speichern<\/strong>. Die Nutzenden können Org-Einheit und Gruppe auch selbst im Profil ändern.<\/p>\n<ul>\n  <li><strong>Anmeldung erlaubt:<\/strong> Nimmst Du den Haken heraus, kann sich die Kostenstelle nicht mehr anmelden. Laufende Sitzungen enden.<\/li>\n<\/ul>\n\n<h3>Abteilungsleitung festlegen oder entziehen<\/h3>\n<p>Es gibt genau eine Kostenstelle mit Abteilungsleiterrechten.<\/p>\n<ul>\n  <li>Klicke in der Spalte <strong>Abteilungsleitung<\/strong> auf <strong>Festlegen<\/strong>. Eine bisherige Abteilungsleitung verliert die Rechte.<\/li>\n  <li>Mit <strong>Entziehen<\/strong> hat danach keine Kostenstelle mehr diese Rechte.<\/li>\n  <li>Nur freigegebene Kostenstellen können die Abteilungsleitung sein.<\/li>\n<\/ul>\n\n<h3>Passwort löschen<\/h3>\n<p>Hat jemand sein Passwort vergessen, klickst Du auf <strong>Passwort löschen<\/strong> und bestätigst. Die Person meldet sich danach wie bei der ersten Anmeldung an und setzt ein neues Passwort. Laufende Sitzungen enden, und eine Sperre wird aufgehoben.<\/p>\n\n<h3>Kostenstelle entfernen<\/h3>\n<p>Mit <strong>Entfernen<\/strong> und Bestätigung löschst Du eine Kostenstelle. Auch alle Budgetpositionen dieser Kostenstelle werden gelöscht. Das lässt sich nicht rückgängig machen.<\/p>\n\n<h2 id=\"einstellungen\">5. Einstellungen<\/h2>\n<h3>Titel der Anwendung<\/h3>\n<p>Der Titel erscheint im Kopfbereich, in der Fußzeile und im Browser-Tab. Er darf 1 bis 60 Zeichen haben.<\/p>\n<h3>Admin-Passwort ändern<\/h3>\n<p>Gib das aktuelle Passwort und zweimal das neue ein. Es gelten dieselben Regeln wie für alle: mindestens 12 Zeichen, Groß- und Kleinbuchstaben, Ziffer und Sonderzeichen.<\/p>\n\n<h2 id=\"testdaten\">6. Testdaten<\/h2>\n<p>Unter <strong>Einstellungen<\/strong> findest Du den Abschnitt <strong>Testdaten<\/strong>. Mit den Testdaten probierst Du alle typischen Fälle der App aus, ohne selbst Kostenstellen anzulegen.<\/p>\n<h3>Testdaten importieren<\/h3>\n<ol>\n  <li>Klicke auf <strong>Testdaten importieren<\/strong>.<\/li>\n  <li>Lies die Warnung. Der Import <strong>löscht alle vorhandenen Kostenstellen<\/strong>, alle Budgetpositionen und die Festlegung der Abteilungsleitung, bevor er die Testdaten anlegt. Admin-Passwort und Titel bleiben erhalten.<\/li>\n  <li>Bestätige mit <strong>Ja, Testdaten importieren<\/strong>. Mit <strong>Abbrechen<\/strong> passiert nichts.<\/li>\n<\/ol>\n<h3>Testdaten löschen<\/h3>\n<p>Klicke auf <strong>Testdaten löschen<\/strong> und bestätige. Es werden nur die importierten Testkostenstellen mit ihren Budgetpositionen entfernt. Selbst angelegte Kostenstellen und ihre Positionen bleiben erhalten. Die Freischaltung der Kalenderjahre bleibt, wie sie ist.<\/p>\n<div class=\"callout callout--warn\">\n  <p>Importiere Testdaten nur in einer Testumgebung. Im Echtbetrieb würden sie die echten Kostenstellen löschen.<\/p>\n<\/div>\n<h3>Enthaltene Fälle<\/h3>\n<p>Alle Testkostenstellen mit gesetztem Passwort haben das Passwort <code>Test-Zugang#2026<\/code>.<\/p>\n<table>\n  <thead><tr><th>Kostenstelle<\/th><th>Fall<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>10000001<\/td><td>Abteilungsleitung mit Passwort, Navigation mit Budgetfreigaben und Upload<\/td><\/tr>\n    <tr><td>10000002<\/td><td>Gruppenleitung mit Passwort und Budgetpositionen: freigegeben (2026, 2027), wartend, abgelehnt mit und ohne Begründung<\/td><\/tr>\n    <tr><td>10000003<\/td><td>Zweite Gruppenleitung mit Passwort: eine freigegebene und zwei wartende Positionen für die Freigaben der Abteilungsleitung<\/td><\/tr>\n    <tr><td>10000004<\/td><td>Erste Anmeldung: noch kein Passwort, Dialog zum Setzen<\/td><\/tr>\n    <tr><td>10000005<\/td><td>Passwort gelöscht, Org-Einheit und Gruppe leer (im Profil ergänzen)<\/td><\/tr>\n    <tr><td>10000006<\/td><td>Gesperrt nach Fehlversuchen (15 Minuten ab Import)<\/td><\/tr>\n    <tr><td>10000007<\/td><td>Nicht freigegeben: Anmeldung nicht erlaubt<\/td><\/tr>\n    <tr><td>10000008<\/td><td>Org-Einheit und Gruppe in maximaler Länge (11 und 30 Zeichen)<\/td><\/tr>\n    <tr><td>Kalenderjahre<\/td><td>2026 und 2027 sind für Budgetpläne freigeschaltet, 2028 ist gesperrt<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 id=\"betrieb\">7. Sicherheit und Betrieb<\/h2>\n<ul>\n  <li><strong>Sperre:<\/strong> Nach 5 Fehlversuchen ist eine Kostenstelle 15 Minuten gesperrt. Die Sperre siehst Du in der Tabelle der Kostenstellen.<\/li>\n  <li><strong>Sitzung:<\/strong> Nach 30 Minuten ohne Aktivität werden Nutzende abgemeldet.<\/li>\n  <li><strong>Datenhaltung:<\/strong> Alle Daten liegen in der Datei <code>App_Data/data.json<\/code> auf dem Server, zusammen mit der Sicherung <code>data.json.bak<\/code>. Nimm diesen Ordner in die Datensicherung auf.<\/li>\n  <li><strong>HTTPS:<\/strong> Die Anwendung läuft auch über HTTP. Über HTTP gehen Passwörter unverschlüsselt durchs Netz. Nutze HTTPS, wenn das Netz nicht vertrauenswürdig ist, und setze dann <code>Security:RequireHttps<\/code> auf <code>true<\/code>.<\/li>\n  <li><strong>Betrieb auf dem IIS:<\/strong> Die Schritte zur Bereitstellung stehen in der README des Projekts.<\/li>\n<\/ul>\n\n<h2 id=\"probleme\">8. Wenn etwas nicht klappt<\/h2>\n<table>\n  <thead><tr><th>Situation<\/th><th>Was Du tun kannst<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Jemand kann sich nicht anmelden<\/td><td>Prüfe unter Kostenstellen, ob <strong>Anmeldung erlaubt<\/strong> angehakt ist und ob eine Sperre besteht. Löse eine Sperre mit <strong>Passwort löschen<\/strong>.<\/td><\/tr>\n    <tr><td>Passwort vergessen<\/td><td>Klicke bei der Kostenstelle auf <strong>Passwort löschen<\/strong>.<\/td><\/tr>\n    <tr><td>Admin-Passwort vergessen<\/td><td>Stoppe die Anwendung, benenne <code>App_Data/data.json<\/code> um und starte sie neu. Die Anwendung legt dann einen neuen Datenbestand mit dem Standardpasswort an. Die alten Kostenstellen stehen danach nicht mehr zur Verfügung.<\/td><\/tr>\n    <tr><td>Anwendung speichert nicht<\/td><td>Prüfe, ob das Konto des Anwendungspools Schreibrechte auf <code>App_Data<\/code> hat.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n", "file": "Budget-Dashboard-Handbuch-Administration.pdf"}};

  }
  function inform(title, text) {
    var d = document.createElement("div"); d.className = "modal";
    d.innerHTML = '<div class="modal__box card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt" class="headline-s">' + esc(title) + '</h2><p class="copy popup__reason">' + esc(text) + '</p><div class="actions"><button class="btn btn--primary" data-m="n">Schließen</button></div></div>';
    document.body.appendChild(d); d.querySelector("button").focus();
    d.addEventListener("click", function (e) { if (e.target === d || (e.target.getAttribute && e.target.getAttribute("data-m"))) d.remove(); });
    d.addEventListener("keydown", function (e) { if (e.key === "Escape") d.remove(); });
  }
  function askReason(item, cb) {
    var d = document.createElement("div"); d.className = "modal";
    d.innerHTML = '<div class="modal__box card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt" class="headline-s">Ablehnung begründen</h2><p class="copy"><strong>' + esc(item.name) + "</strong>, " + fmt(item.cents) + " EUR (Brutto), " + item.year + ', Kostenstelle ' + item.cc + '</p><div class="field"><label for="grund">Grund (optional)</label><textarea id="grund" rows="3" maxlength="500"></textarea></div><div class="actions"><button class="btn btn--primary" data-m="y">OK</button><button class="btn btn--ghost" data-m="n">Abbrechen</button></div></div>';
    document.body.appendChild(d); d.querySelector("textarea").focus();
    d.addEventListener("click", function (e) { var m = e.target.getAttribute && e.target.getAttribute("data-m"); if (m || e.target === d) { var v = d.querySelector("textarea").value.trim(); d.remove(); if (m === "y") cb(v); } });
    d.addEventListener("keydown", function (e) { if (e.key === "Escape") d.remove(); });
  }

  /* ---------- Aktionen ---------- */
  function go(r) { route = r; flash = null; errors = []; flashKind = null; errKind = null; render(); }
  function done(msg, kind) { flash = msg; flashKind = kind || null; errors = []; errKind = null; save(); render(); }
  function fail(l, kind) { errors = l; errKind = kind || null; flash = null; render(); }
  function signIn(n) { var c = find(n); c.failed = 0; c.lock = 0; c.last = Date.now(); session = { number: n, role: roleOf(n) }; manualKey = null; planYear = null; bdraft = {}; pending = null; save(); route = "Dashboard"; }
  function failCount(c) { c.failed++; if (c.failed >= MAX_FAILED) { c.failed = 0; c.lock = Date.now() + LOCK_MIN * 60000; } save(); }
  var checkText = function (o, g) { var e = []; if (o.length > 11) e.push("Die Org-Einheit darf höchstens 11 Zeichen haben."); if (g.length > 30) e.push("Die Gruppe darf höchstens 30 Zeichen haben."); return e; };

  var forms = {
    async login(fd) {
      var n = String(fd.get("ks") || "").trim(), pw = String(fd.get("pw") || ""); loginNum = n;
      var c = /^\d{8}$/.test(n) ? find(n) : null, bad = "Kostenstelle oder Passwort stimmt nicht. Bitte prüfe Deine Eingaben.";
      if (!c || c.enabled === false) { await verifyPw(pw, null); return fail([bad]); }
      if (c.lock > Date.now()) return fail(["Wegen mehrerer Fehlversuche ist die Anmeldung für etwa " + Math.max(1, Math.ceil((c.lock - Date.now()) / 60000)) + " Minuten gesperrt. Bitte versuche es später erneut."]);
      if (!c.hash) { pending = n; errors = []; route = "setpw"; return render(); }
      if (await verifyPw(pw, c.hash)) { loginNum = ""; signIn(n); return render(); }
      failCount(c);
      fail([c.lock > Date.now() ? "Wegen mehrerer Fehlversuche ist die Anmeldung für etwa " + LOCK_MIN + " Minuten gesperrt. Bitte versuche es später erneut." : bad]);
    },
    async setpw(fd) {
      var a = String(fd.get("neu") || ""), b = String(fd.get("wdh") || ""), c = find(pending);
      if (a !== b) return fail(["Die beiden Passwörter stimmen nicht überein."]);
      var e = policy(a, pending); if (e.length) return fail(e);
      if (!c || c.hash) return fail(["Für diese Kostenstelle ist bereits ein Passwort gesetzt. Bitte melde Dich normal an."]);
      c.hash = await hashPw(a); signIn(pending); render();
    },
    bud(fd) {
      var d = { bez: String(fd.get("bez") || "").trim(), betrag: String(fd.get("betrag") || ""), jahr: parseInt(fd.get("jahr"), 10), hinweis: String(fd.get("hinweis") || "").trim() };
      bdraft = d; var e = [], c = parseAmt(d.betrag);
      if (!d.bez) e.push("Bitte gib eine Bezeichnung ein."); else if (d.bez.length > 100) e.push("Die Bezeichnung darf höchstens 100 Zeichen haben.");
      if (c === null) e.push("Bitte gib einen Betrag größer als 0 an, zum Beispiel 1.234,56. Es sind höchstens 2 Nachkommastellen möglich.");
      if (!d.hinweis) e.push("Bitte gib einen Hinweistext zur Freigabe ein."); else if (d.hinweis.length > 500) e.push("Der Hinweistext darf höchstens 500 Zeichen haben.");
      if (data.years.indexOf(d.jahr) < 0) e.push("Für dieses Kalenderjahr sind Budgetpläne nicht freigeschaltet.");
      if (e.length) return fail(e);
      data.items.push({ id: "b" + Date.now() + Math.floor(Math.random() * 1000), cc: session.number, name: d.bez, cents: c, year: d.jahr, note: d.hinweis, status: "pending", reason: null, created: Date.now(), decided: 0 });
      bdraft = {}; done("Die Budgetposition ist zur Freigabe an die Abteilungsleitung gesendet.");
    },
    details(fd) {
      var o = String(fd.get("org") || "").trim(), g = String(fd.get("group") || "").trim(), e = checkText(o, g);
      if (e.length) return fail(e, "det");
      var c = find(session.number); c.org = o; c.group = g; done("Deine Angaben sind aktualisiert.", "det");
    },
    async profil(fd) { await changePw(fd, session.number, "Dein Passwort ist geändert.", "pw"); },
    async adminpw(fd) { await changePw(fd, ADMIN, "Das Admin-Passwort ist geändert."); },
    title(fd) {
      var t = String(fd.get("title") || "").trim();
      if (t.length < 1 || t.length > 60) return fail(["Der Titel braucht 1 bis 60 Zeichen."]);
      data.title = t; document.title = t; done("Der Titel der Anwendung ist geändert.");
    },
    add(fd) {
      var n = String(fd.get("nn") || "").trim(), o = String(fd.get("no") || "").trim(), g = String(fd.get("ng") || "").trim();
      draft = { nn: n, no: o, ng: g, ne: !!fd.get("ne"), nh: !!fd.get("nh") };
      var e = checkText(o, g);
      if (!/^\d{8}$/.test(n)) e.unshift("Eine Kostenstelle besteht aus genau 8 Ziffern.");
      else if (n === ADMIN) e.unshift("Die Kostenstelle 00000000 ist für die Administration reserviert.");
      else if (find(n)) e.unshift("Diese Kostenstelle gibt es bereits.");
      if (e.length) return fail(e);
      data.ccs.push({ number: n, enabled: draft.ne, org: o, group: g, hash: null, failed: 0, lock: 0, last: 0 });
      if (draft.nh && draft.ne) data.head = n;
      draft = {}; done("Kostenstelle " + n + " ist angelegt.");
    }
  };
  async function changePw(fd, n, okMsg, kind) {
    var cur = String(fd.get("aktuell") || ""), a = String(fd.get("neu") || ""), b = String(fd.get("wdh") || ""), c = find(n);
    if (c.lock > Date.now()) return fail(["Das Konto ist vorübergehend gesperrt. Bitte versuche es später erneut."], kind);
    if (!(await verifyPw(cur, c.hash))) { failCount(c); return fail(["Das aktuelle Passwort stimmt nicht."], kind); }
    var e = policy(a, n);
    if (a !== b) e.push("Die beiden neuen Passwörter stimmen nicht überein.");
    if (a === cur) e.push("Das neue Passwort muss sich vom aktuellen unterscheiden.");
    if (e.length) return fail(e, kind);
    c.hash = await hashPw(a); c.failed = 0; if (n === ADMIN) c.must = false;
    done(okMsg, kind);
  }

  async function exportPdf() {
    var m = MANUALS[manualKey], bin = atob(PDFS[manualKey]), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    try { await dl.save({ filename: m.file, data: u.buffer }); pdfMsg = "Das Handbuch wurde als PDF gespeichert."; }
    catch (e) { pdfMsg = e && e.code === "declined" ? "Der Export wurde abgebrochen." : "Der PDF-Export ist hier nicht möglich."; }
    render(); setTimeout(function () { pdfMsg = ""; }, 100);
  }

  function ask(text, yes) {
    var d = document.createElement("div"); d.className = "modal";
    d.innerHTML = '<div class="modal__box card" role="alertdialog" aria-modal="true" aria-labelledby="mt"><p id="mt" class="copy">' + esc(text) + '</p><div class="actions"><button class="btn btn--primary" data-m="y">Ja, bestätigen</button><button class="btn btn--ghost" data-m="n">Abbrechen</button></div></div>';
    document.body.appendChild(d);
    d.querySelector('[data-m="n"]').focus();
    d.addEventListener("click", function (e) { var m = e.target.getAttribute && e.target.getAttribute("data-m"); if (m || e.target === d) { d.remove(); if (m === "y") yes(); } });
    d.addEventListener("keydown", function (e) { if (e.key === "Escape") d.remove(); });
  }

  document.addEventListener("submit", function (e) { var f = e.target.getAttribute("data-form"); if (f && forms[f]) { e.preventDefault(); forms[f](new FormData(e.target)); } });
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-go],[data-act]") : null; if (!t) return;
    if (t.id === "reset-demo") { return ask("Alle Demo-Daten zurücksetzen? Kostenstellen, Passwörter und Einstellungen gehen verloren.", async function () { data = await seed(); session = null; pending = null; route = "login"; draft = {}; save(); render(); }); }
    if (t.hasAttribute("data-go")) { e.preventDefault(); return go(t.getAttribute("data-go")); }
    var act = t.getAttribute("data-act"), n = t.getAttribute("data-n");
    if (act === "askimport") return ask("Beim Import werden alle vorhandenen Kostenstellen gelöscht, auch die Festlegung der Abteilungsleitung. Das lässt sich nicht rückgängig machen. Admin-Passwort und Titel bleiben erhalten. Testdaten jetzt importieren?", async function () { var k = await importTestData(); done("Die Testdaten sind importiert (" + k + " Kostenstellen). Alle vorherigen Kostenstellen sind gelöscht."); });
    if (act === "askdelete") return ask("Alle Testkostenstellen werden gelöscht. Selbst angelegte Kostenstellen bleiben erhalten. Testdaten jetzt löschen?", function () { var k = data.ccs.filter(function (c) { return c.test; }).length; data.ccs = data.ccs.filter(function (c) { return !c.test; }); data.items = data.items.filter(function (i) { return !i.test && find(i.cc); }); if (data.head && !find(data.head)) data.head = null; done(k + " Testkostenstellen sind gelöscht."); });
    if (act === "year") { planYear = parseInt(n, 10); return render(); }
    if (act === "bdel") { var bi = data.items.find(function (x) { return x.id === n && x.cc === session.number; }); if (!bi) return fail(["Den Eintrag gibt es nicht mehr."]); if (bi.status === "approved") return fail(["Freigegebene Positionen lassen sich nicht löschen."]); data.items = data.items.filter(function (x) { return x !== bi; }); return done("Der Eintrag ist gelöscht."); }
    if (act === "reason") { var ri = data.items.find(function (x) { return x.id === n; }); return inform("Grund der Ablehnung", ri && ri.reason ? ri.reason : "Es wurde keine Begründung eingegeben."); }
    if (act === "bapprove") { var ai = data.items.find(function (x) { return x.id === n && x.status === "pending"; }); if (!ai) return fail(["Die Position wartet nicht mehr auf Freigabe."]); ai.status = "approved"; ai.decided = Date.now(); return done("Die Budgetposition ist freigegeben."); }
    if (act === "breject") { var ji = data.items.find(function (x) { return x.id === n && x.status === "pending"; }); if (!ji) return fail(["Die Position wartet nicht mehr auf Freigabe."]); return askReason(ji, function (v) { ji.status = "rejected"; ji.reason = v || null; ji.decided = Date.now(); done("Die Budgetposition ist abgelehnt."); }); }
    if (act === "byear") { var y = parseInt(n, 10), on = t.getAttribute("data-v") === "1"; data.years = data.years.filter(function (x) { return x !== y; }); if (on) data.years.push(y); return done(on ? "Budgetpläne für " + y + " sind aktiviert." : "Budgetpläne für " + y + " sind deaktiviert."); }
    if (act === "pdf") { return exportPdf(); }
    if (act === "manual") { manualKey = n; pdfMsg = ""; return render(); }
    if (act === "logout") { session = null; route = "login"; return go("login"); }
    if (act === "cancelset") { pending = null; return go("login"); }
    if (act === "save") {
      var o = $('[data-org="' + n + '"]').value.trim(), g = $('[data-group="' + n + '"]').value.trim(), en = $('[data-en="' + n + '"]').checked, e2 = checkText(o, g);
      if (e2.length) return fail(e2);
      var c = find(n); c.org = o; c.group = g; c.enabled = en; if (!en && data.head === n) data.head = null;
      return done("Kostenstelle " + n + " ist gespeichert.");
    }
    if (act === "head") { data.head = t.getAttribute("data-v") === "1" ? n : null; return done(data.head ? "Kostenstelle " + n + " hat jetzt Abteilungsleiterrechte." : "Kostenstelle " + n + " hat keine Abteilungsleiterrechte mehr."); }
    if (act === "reset") return ask("Passwort der Kostenstelle " + n + " löschen? Bei der nächsten Anmeldung muss ein neues Passwort gesetzt werden.", function () { var c = find(n); c.hash = null; c.failed = 0; c.lock = 0; done("Das Passwort der Kostenstelle " + n + " ist gelöscht. Beim nächsten Anmelden wird ein neues gesetzt."); });
    if (act === "del") return ask("Kostenstelle " + n + " entfernen?", function () { data.ccs = data.ccs.filter(function (x) { return x.number !== n; }); data.items = data.items.filter(function (i) { return i.cc !== n; }); if (data.head === n) data.head = null; done("Kostenstelle " + n + " ist entfernt."); });
  });

  (async function init() {
    data = load();
    if (!data || !data.admin) { data = await seed(); save(); }
    data.years = data.years || []; data.items = data.items || [];
    document.title = data.title;
    try { if (window.claude && window.claude.use) { var d0 = await window.claude.use("downloads"); if (d0) { dl = d0; } } } catch (e) {}
    render();
  })();
})();

</script>
