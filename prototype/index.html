/* R+V Design: Tokens, Schriften und Komponenten nach dem Design-System "R+V Design".
   Regeln: 4 px Radius, keine Schatten, keine Verläufe, Mint nur für Interaktion, Fokusring 3 px.
   Alle Bedienelemente (Buttons, Felder, Auswahl, Reiter) sind 48 px hoch, kleine 36 px. */

:root {
  --primary: #001957;
  --white: #ffffff;
  --orange-light: #f79506;
  --orange-dark: #eb6504;
  --mint-light: #00dcdc;
  --mint-dark: #109da8;
  --sand: #fff4e0;
  --grey-1: #f5f5f5;
  --grey-2: #ececec;
  --grey-3: #c7c7c7;
  --grey-4: #888888;
  --grey-5: #707070;
  --red-1: #ff4c4c;
  --red-2: #ff8484;
  --green-ok: #759a03;
  --green-ok-light: #8ebc27;

  --font-sans: "RuV Sans", Arial, Helvetica, sans-serif;
  --font-slab: "RuV Slab", Georgia, serif;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --radius-base: 4px;

  --control-h: 48px;
  --control-h-s: 36px;
  --footer-h: 48px;
}

:root,
[data-theme="hell"] {
  --surface: var(--white);
  --surface-soft: var(--sand);
  --ink: var(--primary);
  --ink-muted: var(--grey-5);
  --highlight: var(--orange-dark);
  --interactive: var(--mint-dark);
  --interactive-hover: var(--mint-light);
  --on-interactive: var(--primary);
  --link: #167b8a;
  --border: var(--grey-3);
  --error: var(--red-1);
  --success: var(--green-ok);
  --zebra: var(--sand);
  --hover: var(--grey-1);
  --footer: var(--grey-1);
}

[data-theme="dunkel"] {
  --surface: var(--primary);
  --surface-soft: var(--primary);
  --ink: var(--white);
  --ink-muted: #bdc4d4;
  --highlight: var(--orange-light);
  --interactive: var(--mint-light);
  --interactive-hover: #2ee6e6;
  --on-interactive: var(--primary);
  --link: #5befef;
  --border: #a2abc2;
  --error: var(--red-2);
  --success: var(--green-ok-light);
  --zebra: #0a2a6e;
  --hover: #0a2a6e;
  --footer: #0a2a6e;
}

/* ---------- Grundlagen ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--ink);
  font: 400 16px/24px var(--font-sans);
}
body.is-auth { background: var(--surface-soft); }

a { color: var(--link); }
h1, h2, h3, p { margin: 0; }
strong { font-weight: 900; }
code { background: var(--grey-1); padding: 1px 6px; border-radius: var(--radius-base); color: var(--primary); font-size: .92em; }
:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.skip-link {
  position: absolute; left: var(--space-3); top: -100px; z-index: 30;
  background: var(--white); color: var(--primary); padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-base); font-weight: 700;
}
.skip-link:focus { top: var(--space-2); }

/* ---------- Typografie ---------- */
.topline { font: 700 20px/1.3 var(--font-slab); color: var(--highlight); }
.headline { font: 700 36px/1.15 var(--font-sans); text-wrap: balance; }
.headline-s { font: 700 20px/1.25 var(--font-sans); }
.copy-s, .hint { font: 400 14px/21px var(--font-sans); }
.hint { color: var(--ink-muted); }

/* ---------- Kopfbereich ---------- */
.app-header { background: var(--surface); color: var(--ink); }
.app-header__inner {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) var(--space-4); min-height: 76px;
}
.app-header__brand { display: flex; align-items: center; gap: var(--space-4); color: var(--ink); text-decoration: none; }
.app-header__logo { height: 44px; width: auto; display: block; }
.app-header__title { font: 700 20px/1.2 var(--font-sans); padding-left: var(--space-4); border-left: 2px solid var(--highlight); }
.app-header__side { display: flex; align-items: center; gap: var(--space-4); }
.app-header__user { display: flex; flex-direction: column; align-items: flex-end; font: 400 14px/21px var(--font-sans); }
.app-header__role { font-weight: 700; color: var(--highlight); }
.app-header__help, button.app-header__help {
  display: inline-flex; align-items: center; height: var(--control-h-s); padding: 0 var(--space-3);
  color: var(--ink); background: none; border: 2px solid var(--ink); border-radius: var(--radius-base);
  font: 700 14px/1 var(--font-sans); text-decoration: none; cursor: pointer;
}
.app-header__help:hover { background: var(--ink); color: var(--surface); }

/* ---------- Horizontale Navigation ---------- */
.app-nav { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
.app-nav__list { display: flex; align-items: stretch; margin: 0; padding: 0 var(--space-3); list-style: none; overflow-x: auto; scrollbar-width: thin; }
.app-nav__list li { display: flex; }
.app-nav__list form { display: flex; margin: 0; }
.app-nav__end { margin-left: auto; }
.app-nav__link {
  display: flex; align-items: center; height: 52px; padding: 0 var(--space-3); white-space: nowrap;
  background: none; border: 0; border-bottom: 4px solid transparent;
  color: var(--ink); font: 700 16px/1 var(--font-sans); text-decoration: none; cursor: pointer;
}
.app-nav__link:hover { background: var(--hover); }
.app-nav__link.is-active { border-bottom-color: var(--interactive); }
.app-nav__link:focus-visible { outline-offset: -3px; }

/* ---------- Inhalt in voller Breite ---------- */
.content { flex: 1; width: 100%; padding: var(--space-5) var(--space-4) calc(var(--space-6) + var(--footer-h)); }
.page > * + * { margin-top: var(--space-4); }
.page > .topline + .headline { margin-top: var(--space-1); }
.page > .headline + * { margin-top: var(--space-4); }
.page > .pill-tabs { margin-top: var(--space-4); }

.app-footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; height: var(--footer-h);
  display: flex; align-items: center; padding: 0 var(--space-4);
  background: var(--footer); border-top: 1px solid var(--border); color: var(--ink-muted); font: 400 14px/21px var(--font-sans);
}

/* ---------- Karten und Kacheln ---------- */
.card { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-base); padding: var(--space-4); }
.card--soft { background: var(--surface-soft); }
.card > * + * { margin-top: var(--space-3); }
.card--form { max-width: 720px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--space-4); align-items: start; }
.grid-2 .card--form { max-width: none; }

.facts { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-4); margin: 0; }
.card > .facts, .card > .notices { margin-top: var(--space-3); }
.facts dt { font-weight: 700; }
.facts dd { margin: 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }
.stat { border: 1px solid var(--border); border-radius: var(--radius-base); padding: var(--space-4); background: var(--surface-soft); }
.stat__value { font: 700 40px/1.1 var(--font-sans); font-variant-numeric: tabular-nums; }
.stat__label { font: 400 14px/21px var(--font-sans); color: var(--ink-muted); margin-top: var(--space-1); }

/* ---------- Anmeldung ---------- */
.auth { display: flex; justify-content: center; padding-top: var(--space-5); }
.auth__card { position: relative; width: 100%; max-width: 480px; padding: var(--space-5); }
.auth__card::before {
  content: ""; position: absolute; top: -1px; left: -1px; width: 32px; height: 32px;
  border-top: 8px solid var(--highlight); border-left: 8px solid var(--highlight); border-top-left-radius: var(--radius-base);
}
.auth__card > * + * { margin-top: var(--space-3); }
.auth__card > .headline { margin-top: var(--space-1); }
.auth__card > .topline { margin-top: var(--space-2); }

/* ---------- Formulare ---------- */
.form { display: flex; flex-direction: column; gap: var(--space-3); }
.form--row { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.field label { font: 700 16px/1.2 var(--font-sans); }
.field--check { gap: var(--space-2); justify-content: flex-end; }
.field--check label, .check { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 400; min-height: 20px; }
.form--row .field { width: 200px; }
.form--row .field--check { width: auto; }
.form--row .field--wide { width: 100%; }
.form--row .field--check { height: var(--control-h); justify-content: space-between; gap: 0; }
.form--nowrap { flex-wrap: nowrap; }
.form--nowrap .field { flex: 0 0 200px; }
.form--nowrap .field--check { flex: 0 0 auto; }

input[type="text"], input[type="password"], input:not([type]), input[inputmode], select {

}

  background-repeat: no-repeat; background-position: right 14px center;
}
textarea {

  background: var(--surface); color: var(--ink); font: 400 16px/1.4 var(--font-sans);
}
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--mint-dark); margin: 0; flex: none; }
input.cell-input { height: var(--control-h-s); min-width: 110px; padding: 0 8px; font-size: 14px; }
.cell-input--wide { min-width: 220px; }
.amount-link { display: flex; align-items: flex-end; gap: var(--space-3); flex-wrap: wrap; }

.amount-link .field--narrow { width: 140px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; height: var(--control-h); padding: 0 var(--space-4);
  border: 2px solid transparent; border-radius: var(--radius-base);
  font: 700 16px/1 var(--font-sans); text-decoration: none; white-space: nowrap; cursor: pointer; transition: background .15s, color .15s;
}
.btn--primary { background: var(--interactive); color: var(--on-interactive); }
.btn--primary:hover { background: var(--interactive-hover); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--surface); }
.btn--small { height: var(--control-h-s); padding: 0 var(--space-3); font-size: 14px; }

.actions { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.inline-form { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin: 0; }
.row-actions { display: grid; grid-template-columns: max-content max-content; justify-content: start; gap: var(--space-2); }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: var(--control-h-s); height: var(--control-h-s); border: 2px solid transparent; border-radius: var(--radius-base); background: none; color: var(--ink); cursor: pointer; }
.icon-btn:hover { border-color: var(--ink); }

/* ---------- Reiter (Unterpunkte, Jahre, Handbücher) ---------- */
.pill-tabs, .manual-tabs { display: flex; flex-wrap: wrap; gap: var(--space-2); list-style: none; margin: 0; padding: 0; }
.pill, .manual-tab {
  display: inline-flex; align-items: center; height: var(--control-h-s); padding: 0 var(--space-3);
  border: 2px solid var(--ink); border-radius: var(--radius-base); background: none; color: var(--ink);
  font: 700 14px/1 var(--font-sans); text-decoration: none; cursor: pointer;
}
.pill:hover, .manual-tab:hover { background: var(--hover); }
.pill.is-active, .manual-tab.is-active { background: var(--interactive); border-color: var(--interactive); color: var(--on-interactive); }

.scope-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3); }
.scope-form select { min-width: 300px; max-width: 100%; }

/* ---------- Meldungen ---------- */
.alert { border: 2px solid var(--border); border-radius: var(--radius-base); padding: var(--space-3) var(--space-4); max-width: 720px; background: var(--surface); }
.alert--error { border-color: var(--error); }

.notice-bar { background: var(--surface-soft); border-bottom: 1px solid var(--border); padding: 12px var(--space-4); font: 400 14px/21px var(--font-sans); }
.view-bar { background: var(--surface-soft); color: var(--ink); border-bottom: 2px solid var(--highlight); padding: 10px var(--space-4); font: 400 14px/21px var(--font-sans); }
#testdaten { display: flex; flex-direction: column; gap: var(--space-3); }
#testdaten > * { margin-top: 0 !important; }

/* ---------- Tabellen ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-base); }
.table { width: 100%; border-collapse: collapse; font: 400 14px/21px var(--font-sans); }
.table thead th { background: var(--primary); color: var(--white); text-align: left; font-weight: 700; padding: 12px var(--space-3); white-space: nowrap; }
.table td, .table tbody th { padding: 10px var(--space-3); text-align: left; vertical-align: middle; }
.table tbody th { font-weight: 700; white-space: nowrap; }
.table tbody tr:nth-child(even) { background: var(--zebra); }
.table tbody tr:hover { background: var(--hover); }
.table tfoot th, .table tfoot td { background: var(--surface); border-top: 2px solid var(--ink); padding: 12px var(--space-3); text-align: left; }

td .hint { display: block; white-space: nowrap; }
.table--dense thead th, .table--dense td, .table--dense tbody th { padding-left: 12px; padding-right: 12px; }

.status { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 2px solid var(--border); border-radius: var(--radius-base); font: 700 14px/1 var(--font-sans); background: none; color: var(--ink); }
.status--rejected { border-color: var(--error); cursor: pointer; }

.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: 2px solid var(--error); border-radius: var(--radius-base); font: 700 13px/1 var(--font-sans); margin-left: var(--space-1); }

/* ---------- Mitteilungen ---------- */
.notices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.notice { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--border); }

/* ---------- Pop-ups ---------- */
.popup { border: 1px solid var(--border); border-radius: var(--radius-base); padding: var(--space-4); max-width: 520px; width: calc(100% - 32px); background: var(--surface); color: var(--ink); }

.modal { position: fixed; inset: 0; background: rgba(0, 25, 87, .6); display: flex; align-items: center; justify-content: center; padding: var(--space-3); z-index: 40; }
.modal__box { max-width: 480px; width: 100%; }
.modal__box > * + * { margin-top: var(--space-3); }

/* ---------- Handbücher ---------- */
.manual-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
.manual { max-width: 860px; }
.manual > * + * { margin-top: var(--space-3); }
.manual h2 { font: 700 28px/1.2 var(--font-sans); margin-top: var(--space-6); padding-top: var(--space-3); border-top: 1px solid var(--border); }
.manual h3 { font: 700 20px/1.2 var(--font-sans); margin-top: var(--space-5); }
.manual ul, .manual ol { padding-left: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.manual .meta { color: var(--ink-muted); font-size: 14px; }
.manual .toc { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-base); padding: var(--space-3) var(--space-4); }
.manual .toc p { font-weight: 700; }
.manual .toc ol { margin: var(--space-2) 0 0; }
.manual .callout { border: 2px solid var(--mint-dark); border-radius: var(--radius-base); padding: var(--space-3) var(--space-4); }
.manual .callout--warn { border-color: var(--orange-dark); }
.manual table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 21px; }
.manual th { background: var(--primary); color: var(--white); text-align: left; padding: 10px 14px; }
.manual td { padding: 10px 14px; vertical-align: top; }
.manual tbody tr:nth-child(even) { background: var(--zebra); }
.manual kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--radius-base); padding: 0 6px; font: 700 13px/1.6 var(--font-sans); }

/* ---------- Schmale Bildschirme ---------- */
@media (max-width: 1180px) {
  .form--nowrap { flex-wrap: wrap; }
}

@media (max-width: 720px) {
  .app-header__inner { flex-direction: column; align-items: flex-start; gap: var(--space-2); padding: var(--space-3); }
  .app-header__side { width: 100%; justify-content: space-between; }
  .app-header__user { align-items: flex-end; }
  .app-header__title { padding-left: var(--space-3); }
  .headline { font-size: 28px; }
  .content { padding: var(--space-4) var(--space-3) calc(var(--space-5) + var(--footer-h)); }
  .app-footer { padding: 0 var(--space-3); }
  .form--row .field, .amount-link .field { width: 100%; }
  .amount-link__op { display: none; }
  .auth__card { padding: var(--space-4); }
  .scope-form select { min-width: 0; width: 100%; }
}

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  /* ---------- Krypto (PBKDF2 im Browser, nur Demo) ---------- */
  var b64 = function (u) { return btoa(String.fromCharCode.apply(null, u)); };
  var unb64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  async function derive(pw, salt) {

  async function verifyPw(pw, stored) {

    var p = stored.split("."), h = await derive(pw, unb64(p[0])), e = unb64(p[1]), d = 0;
    for (var i = 0; i < e.length; i++) d |= h[i] ^ e[i];
    return d === 0;
  }

  /* ---------- Daten ---------- */
  var mem = null;
  function load() {
    try { var s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
    return mem;

  async function seed() {

      ccs: []
    };
  }
  var data = null, session = null, route = "login", pending = null, flash = null, errors = [], draft = {}, loginNum = "";
  var find = function (n) { return n === ADMIN ? data.admin : data.ccs.find(function (c) { return c.number === n; }); };
  var roleOf = function (n) { return n === ADMIN ? "Admin" : n === data.head ? "Abteilungsleiter" : "Gruppenleiter"; };
  var roleLabel = function (r) { return r === "Admin" ? "Administration" : r === "Abteilungsleiter" ? "Abteilungsleitung" : "Gruppenleitung"; };

  function policy(pw, num) {
    var e = [];
    if (pw.length < 12) e.push("Das Passwort braucht mindestens 12 Zeichen.");
    if (pw.length > 128) e.push("Das Passwort darf höchstens 128 Zeichen haben.");
    if (!/[A-ZÄÖÜ]/.test(pw)) e.push("Das Passwort braucht mindestens einen Großbuchstaben.");
    if (!/[a-zäöüß]/.test(pw)) e.push("Das Passwort braucht mindestens einen Kleinbuchstaben.");
    if (!/[0-9]/.test(pw)) e.push("Das Passwort braucht mindestens eine Ziffer.");
    if (!/[^\p{L}\p{N}\s]/u.test(pw)) e.push("Das Passwort braucht mindestens ein Sonderzeichen.");
    if (num && pw.indexOf(num) >= 0) e.push("Das Passwort darf Deine Kostenstelle nicht enthalten.");
    var l = pw.toLowerCase();
    if (BLOCK.some(function (b) { return l.indexOf(b) >= 0; })) e.push("Das Passwort enthält ein zu bekanntes Muster.");
    return e;
  }

  var MANUALS = {"nutzer": {"title": "Handbuch für Nutzende", "short": "Nutzende", "html": "<p class=\"meta\">Version 2.0 · Stand Oktober 2026<\/p>\n<p>Dieses Handbuch erklärt Dir, wie Du Dich im Budget-Dashboard 2.0 anmeldest, Deine Angaben pflegst und Dein Passwort änderst. Es richtet sich an alle Nutzenden mit einer Kostenstelle.<\/p>\n\n<nav class=\"toc\" aria-label=\"Inhalt\">\n  <p>Inhalt<\/p>\n  <ol>\n    <li><a href=\"#anmelden\">Anmelden<\/a><\/li>\n    <li><a href=\"#erste-anmeldung\">Erste Anmeldung und Passwort setzen<\/a><\/li>\n    <li><a href=\"#navigation\">Die Navigation<\/a><\/li>\n    <li><a href=\"#budgetplan\">Budgetplan<\/a><\/li>\n    <li><a href=\"#jahresbudget\">Jahresbudget<\/a><\/li>\n    <li><a href=\"#profil\">Profil: Angaben und Passwort<\/a><\/li>\n    <li><a href=\"#abmelden\">Abmelden und Sitzung<\/a><\/li>\n    <li><a href=\"#probleme\">Wenn etwas nicht klappt<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<h2 id=\"anmelden\">1. Anmelden<\/h2>\n<p>Öffne die Adresse der Anwendung in Deinem Browser. Auf der Anmeldeseite gibst Du zwei Dinge ein:<\/p>\n<ul>\n  <li><strong>Kostenstelle:<\/strong> eine Zahl mit genau 8 Ziffern.<\/li>\n  <li><strong>Passwort:<\/strong> Dein persönliches Passwort.<\/li>\n<\/ul>\n<p>Klicke dann auf <strong>Jetzt anmelden<\/strong>. Du landest auf Deinem Dashboard.<\/p>\n<div class=\"callout\">\n  <p>Du kannst Dich nur anmelden, wenn Deine Kostenstelle freigegeben ist. Die Freigabe übernimmt die Administration.<\/p>\n<\/div>\n\n<h2 id=\"erste-anmeldung\">2. Erste Anmeldung und Passwort setzen<\/h2>\n<p>Meldest Du Dich zum ersten Mal an, hast Du noch kein Passwort. Gehe so vor:<\/p>\n<ol>\n  <li>Gib Deine Kostenstelle ein und lass das Feld <strong>Passwort<\/strong> leer.<\/li>\n  <li>Klicke auf <strong>Jetzt anmelden<\/strong>. Es erscheint der Dialog <strong>Bitte setze ein Passwort<\/strong>.<\/li>\n  <li>Gib Dein neues Passwort zweimal ein und klicke auf <strong>Passwort speichern<\/strong>.<\/li>\n<\/ol>\n<p>Danach bist Du angemeldet. Bei jeder weiteren Anmeldung brauchst Du dieses Passwort.<\/p>\n<h3>Regeln für das Passwort<\/h3>\n<ul>\n  <li>mindestens 12 Zeichen<\/li>\n  <li>Groß- und Kleinbuchstaben<\/li>\n  <li>mindestens eine Ziffer<\/li>\n  <li>mindestens ein Sonderzeichen, zum Beispiel <kbd>#<\/kbd>, <kbd>-<\/kbd> oder <kbd>!<\/kbd><\/li>\n  <li>ohne Deine Kostenstelle und ohne bekannte Muster wie „Passwort“<\/li>\n<\/ul>\n<div class=\"callout callout--warn\">\n  <p>Gib Dein Passwort an niemanden weiter. Wenn Du es vergessen hast, bittest Du die Administration, es zu löschen. Danach setzt Du ein neues.<\/p>\n<\/div>\n\n<h2 id=\"navigation\">3. Die Navigation<\/h2>\n<p>Unter dem Kopfbereich verläuft die Navigation waagerecht. Der Inhalt nutzt die ganze Breite.<\/p>\n<table>\n  <thead><tr><th>Menüpunkt<\/th><th>Wofür er da ist<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard<\/td><td>Startseite mit Deinen Angaben (Kostenstelle, Org-Einheit, Gruppe, Rolle) und Mitteilungen der Abteilungsleitung.<\/td><\/tr>\n    <tr><td>Budgetplan<\/td><td>Budgetpositionen anfragen und freigegebene Positionen ansehen (siehe Abschnitt 4).<\/td><\/tr>\n    <tr><td>Jahresbudget<\/td><td>Zahlen und Diagramme zu den Ausgaben eines Kalenderjahres. Der Bereich wird demnächst gefüllt (siehe Abschnitt 5).<\/td><\/tr>\n    <tr><td>Profil<\/td><td>Deine Angaben und Dein Passwort ändern.<\/td><\/tr>\n    <tr><td>Abmelden<\/td><td>Sitzung beenden.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<p>Oben rechts im Kopfbereich findest Du die Schaltfläche <strong>Handbuch<\/strong>. Dort kannst Du dieses Handbuch auch als PDF herunterladen.<\/p>\n\n<h2 id=\"budgetplan\">4. Budgetplan<\/h2>\n<p>Im Menüpunkt <strong>Budgetplan<\/strong> fragst Du als Gruppenleitung Budgetpositionen bei der Abteilungsleitung an und siehst die freigegebenen Positionen. Der Budgetplan hat drei Unterpunkte, die Du oben im Bereich auswählst:<\/p>\n<table>\n  <thead><tr><th>Unterpunkt<\/th><th>Was Du dort findest<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard<\/td><td>Dieser Bereich ist zunächst leer und wird demnächst gefüllt.<\/td><\/tr>\n    <tr><td>Gesamtbudgetplan<\/td><td>Alle freigegebenen Budgetpositionen Deiner Kostenstelle für ein Kalenderjahr, mit Summe. Sind mehrere Kalenderjahre freigeschaltet, schaltest Du zwischen den Jahren um.<\/td><\/tr>\n    <tr><td>Eingabe Budgetposition<\/td><td>Neue Budgetpositionen bei der Abteilungsleitung anfragen. Unter dem Formular siehst Du den Status Deiner Anfragen.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n<div class=\"callout\">\n  <p>Du kannst nur für Kalenderjahre Positionen anfragen, die die Abteilungsleitung freigeschaltet hat. Ist noch kein Jahr freigeschaltet, siehst Du einen Hinweis und das Formular fehlt.<\/p>\n<\/div>\n\n<h3>Budgetposition anfragen<\/h3>\n<ol>\n  <li>Öffne <strong>Budgetplan<\/strong> und dann <strong>Eingabe Budgetposition<\/strong>.<\/li>\n  <li>Gib die <strong>Bezeichnung<\/strong> ein, höchstens 100 Zeichen.<\/li>\n  <li>Gib den <strong>Betrag in EUR (Netto)<\/strong> oder den <strong>Betrag in EUR (Brutto)<\/strong> ein, zum Beispiel <kbd>1.234,56<\/kbd>. Die beiden Felder rechnen sich gegenseitig: Tippst Du den Nettobetrag, erscheint im Bruttofeld sofort Netto × 1,19. Tippst Du den Bruttobetrag, erscheint im Nettofeld Brutto ÷ 1,19. Beträge haben bis zu 2 Stellen hinter dem Komma und werden immer mit 2 Nachkommastellen angezeigt. Gespeichert und im Budgetplan angezeigt wird der Bruttobetrag.<\/li>\n  <li>Wähle das <strong>Kalenderjahr<\/strong>. Zur Auswahl stehen die freigeschalteten Jahre.<\/li>\n  <li>Schreibe den <strong>Hinweistext zur Freigabe<\/strong>. Begründe kurz, wofür Du das Budget brauchst. Der Text ist ein Pflichtfeld, höchstens 500 Zeichen.<\/li>\n  <li>Klicke auf <strong>Freigabe<\/strong>. Die Anfrage geht an die Abteilungsleitung und erscheint dort unter „offene Freigaben“.<\/li>\n<\/ol>\n\n<h3>Status der Freigaben<\/h3>\n<p>Unter dem Formular zeigt die Tabelle <strong>Status der Freigaben<\/strong> alle Anfragen, die noch nicht genehmigt sind:<\/p>\n<ul>\n  <li><strong>Warten …<\/strong>: Die Abteilungsleitung hat noch nicht entschieden.<\/li>\n  <li><strong>Abgelehnt<\/strong>: Klicke auf das Wort „Abgelehnt“. Ein Fenster zeigt den Grund der Ablehnung. Wurde kein Grund eingegeben, steht dort „Es wurde keine Begründung eingegeben.“<\/li>\n  <li><strong>Genehmigt<\/strong>: Die Position verschwindet aus der Tabelle. Du findest sie im <strong>Gesamtbudgetplan<\/strong> im jeweiligen Kalenderjahr.<\/li>\n<\/ul>\n<h3>Einträge löschen<\/h3>\n<p>Mit dem <strong>Papierkorb<\/strong> am Ende der Zeile löschst Du einen Eintrag aus der Tabelle.<\/p>\n<ul>\n  <li>Hat der Eintrag den Status „Warten …“, verschwindet er auch bei der Abteilungsleitung. Die Anfrage ist damit zurückgezogen.<\/li>\n  <li>Hat der Eintrag den Status „Abgelehnt“, verschwindet er nur aus Deiner Tabelle.<\/li>\n  <li>Freigegebene Positionen lassen sich nicht löschen.<\/li>\n<\/ul>\n<h3>Freigegebene Positionen ansehen<\/h3>\n<p>Im <strong>Gesamtbudgetplan<\/strong> wählst Du oben das Kalenderjahr. Die Tabelle zeigt Bezeichnung, Betrag (Brutto), Hinweis und Freigabedatum. Darunter steht die Summe des Jahres.<\/p>\n\n<h3>Mitteilungen der Abteilungsleitung<\/h3>\n<p>Entfernt die Abteilungsleitung eine bereits freigegebene Position Deiner Kostenstelle, erhältst Du eine Mitteilung mit der Position und dem <strong>Grund<\/strong> der Entfernung. Solange eine Mitteilung offen ist, zeigt ein Band unter der Navigation „Du hast neue Mitteilungen“. Auf dem <strong>Dashboard<\/strong> liest Du die Mitteilungen und bestätigst sie mit <strong>Gelesen<\/strong>. Danach verschwinden sie.<\/p>\n<h3>Wenn ein Kalenderjahr deaktiviert wird<\/h3>\n<p>Deaktiviert die Abteilungsleitung ein Kalenderjahr, verschwinden die Positionen dieses Jahres aus Deiner Anzeige: aus dem Gesamtbudgetplan und aus der Status-Tabelle. Die Daten bleiben erhalten. Aktiviert die Abteilungsleitung das Jahr wieder, siehst Du alles wieder.<\/p>\n\n<h2 id=\"jahresbudget\">5. Jahresbudget<\/h2>\n<p>Im Menüpunkt <strong>Jahresbudget<\/strong> werden später die Ausgaben eines Kalenderjahres als Zahlen und Diagramme zusammengefasst. Der Bereich ist in dieser Version noch leer. Du kannst schon jetzt oben zwischen den freigeschalteten Kalenderjahren umschalten.<\/p>\n\n<h2 id=\"profil\">6. Profil: Angaben und Passwort<\/h2>\n<h3>Org-Einheit und Gruppe ändern<\/h3>\n<ol>\n  <li>Öffne <strong>Profil<\/strong>.<\/li>\n  <li>Im Abschnitt <strong>Meine Angaben<\/strong> trägst Du Deine <strong>Org-Einheit<\/strong> (höchstens 11 Zeichen) und Deine <strong>Gruppe<\/strong> (höchstens 30 Zeichen) ein.<\/li>\n  <li>Klicke auf <strong>Angaben speichern<\/strong>. Du siehst die Meldung „Gespeichert“.<\/li>\n<\/ol>\n<p>Deine <strong>Kostenstelle<\/strong> steht dort ebenfalls, lässt sich aber nicht ändern.<\/p>\n<h3>Passwort ändern<\/h3>\n<ol>\n  <li>Gib im Abschnitt <strong>Passwort ändern<\/strong> zuerst Dein aktuelles Passwort ein.<\/li>\n  <li>Gib das neue Passwort zweimal ein. Es muss die Regeln aus Abschnitt 2 erfüllen und sich vom aktuellen unterscheiden.<\/li>\n  <li>Klicke auf <strong>Passwort speichern<\/strong>.<\/li>\n<\/ol>\n<p>Andere Sitzungen mit Deiner Kostenstelle werden dabei beendet. Du selbst bleibst angemeldet.<\/p>\n\n<h2 id=\"abmelden\">7. Abmelden und Sitzung<\/h2>\n<p>Klicke in der Navigation auf <strong>Abmelden<\/strong>, wenn Du fertig bist. Das ist besonders wichtig an gemeinsam genutzten Rechnern.<\/p>\n<p>Nach 30 Minuten ohne Aktivität meldet Dich die Anwendung automatisch ab. Du meldest Dich dann einfach neu an.<\/p>\n\n<h2 id=\"probleme\">8. Wenn etwas nicht klappt<\/h2>\n<table>\n  <thead><tr><th>Meldung oder Situation<\/th><th>Was Du tun kannst<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>„Kostenstelle oder Passwort stimmt nicht“<\/td><td>Prüfe die 8 Ziffern und das Passwort. Achte auf Groß- und Kleinschreibung. Ist Deine Kostenstelle noch nicht freigegeben, wende Dich an die Administration.<\/td><\/tr>\n    <tr><td>„Die Anmeldung ist gesperrt“<\/td><td>Nach 5 Fehlversuchen ist Deine Kostenstelle 15 Minuten gesperrt. Warte kurz und versuche es dann erneut.<\/td><\/tr>\n    <tr><td>Passwort vergessen<\/td><td>Bitte die Administration, Dein Passwort zu löschen. Danach meldest Du Dich wie bei der ersten Anmeldung an und setzt ein neues.<\/td><\/tr>\n    <tr><td>„Dieser Bereich ist für Dich nicht freigegeben“<\/td><td>Der Bereich gehört zu einer anderen Rolle, zum Beispiel zur Abteilungsleitung.<\/td><\/tr>\n    <tr><td>Im Formular fehlt das Kalenderjahr oder die Meldung „Kalenderjahr nicht freigeschaltet“ erscheint<\/td><td>Die Abteilungsleitung hat das Jahr noch nicht freigeschaltet. Frage dort nach.<\/td><\/tr>\n    <tr><td>Meldung zum Betrag<\/td><td>Gib den Betrag größer als 0 mit höchstens 2 Nachkommastellen ein, zum Beispiel 1.234,56.<\/td><\/tr>\n    <tr><td>Org-Einheit oder Gruppe zu lang<\/td><td>Kürze den Text auf 11 beziehungsweise 30 Zeichen.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n", "file": "Budget-Dashboard-Handbuch-Nutzende.pdf"}, "abteilungsleitung": {"title": "Handbuch für die Abteilungsleitung", "short": "Abteilungsleitung", "html": "<p class=\"meta\">Version 2.0 · Stand Oktober 2026<\/p>\n<p>Dieses Handbuch richtet sich an die Abteilungsleitung. Alles, was für alle Nutzenden gilt, steht im Handbuch für Nutzende. Hier findest Du, was für die Abteilungsleitung zusätzlich gilt.<\/p>\n\n<nav class=\"toc\" aria-label=\"Inhalt\">\n  <p>Inhalt<\/p>\n  <ol>\n    <li><a href=\"#rolle\">Deine Rolle<\/a><\/li>\n    <li><a href=\"#navigation\">Die Navigation der Abteilungsleitung<\/a><\/li>\n    <li><a href=\"#budgetfreigaben\">Budgetfreigaben: Dashboard, offene Freigaben und Freischaltung<\/a><\/li>\n    <li><a href=\"#budgetplan\">Budgetplan: eigene Positionen und andere Kostenstellen<\/a><\/li>\n    <li><a href=\"#jahresbudget\">Jahresbudget<\/a><\/li>\n    <li><a href=\"#upload\">Upload<\/a><\/li>\n    <li><a href=\"#rechte\">Rechte erhalten und verlieren<\/a><\/li>\n    <li><a href=\"#gemeinsam\">Was Du wie alle Nutzenden tust<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<h2 id=\"rolle\">1. Deine Rolle<\/h2>\n<p>Die Administration legt fest, welche Kostenstelle die Rechte der Abteilungsleitung hat. Es gibt genau eine solche Kostenstelle. Die Anmeldung läuft wie bei allen anderen: mit Kostenstelle und Passwort. Oben rechts im Kopfbereich steht Deine Rolle als <strong>Abteilungsleitung<\/strong>.<\/p>\n\n<h2 id=\"navigation\">2. Die Navigation der Abteilungsleitung<\/h2>\n<p>Du siehst alle Menüpunkte der Nutzenden. Hinter <strong>Jahresbudget<\/strong> stehen zusätzlich zwei Punkte:<\/p>\n<table>\n  <thead><tr><th>Menüpunkt<\/th><th>Wer ihn sieht<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard, Budgetplan, Jahresbudget<\/td><td>alle Nutzenden<\/td><\/tr>\n    <tr><td><strong>Budgetfreigaben<\/strong> mit den Unterpunkten Dashboard, offene Freigaben und Freischaltung Budgetpläne<\/td><td>nur die Abteilungsleitung<\/td><\/tr>\n    <tr><td><strong>Upload<\/strong><\/td><td>nur die Abteilungsleitung<\/td><\/tr>\n    <tr><td>Profil, Abmelden<\/td><td>alle Nutzenden<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 id=\"budgetfreigaben\">3. Budgetfreigaben<\/h2>\n<p>Der Menüpunkt <strong>Budgetfreigaben<\/strong> hat drei Unterpunkte: <strong>Dashboard<\/strong>, <strong>offene Freigaben<\/strong> und <strong>Freischaltung Budgetpläne<\/strong>. Beim Klick auf „Budgetfreigaben“ öffnet sich zuerst das Dashboard.<\/p>\n\n<h3 id=\"dashboard\">Dashboard<\/h3>\n<p>Das Dashboard gibt Dir den Überblick über die gesamte Abteilung:<\/p>\n<ul>\n  <li>drei Kennzahlen: offene Freigaben, freigeschaltete Kalenderjahre und freigegebene Positionen<\/li>\n  <li>eine Tabelle <strong>Alle Kalenderjahre im Überblick<\/strong> mit dem Status der Freischaltung, der Zahl und Summe der freigegebenen Positionen (Brutto) und den wartenden Beträgen<\/li>\n  <li>die Tabelle <strong>Freigegebene Beträge je Gruppe<\/strong> mit den Summen je Kostenstelle und Kalenderjahr<\/li>\n<\/ul>\n<p>Ein Link führt Dich direkt zu den offenen Freigaben.<\/p>\n\n<h3 id=\"freigaben\">Offene Freigaben<\/h3>\n<p>Der Reiter zeigt in Klammern, wie viele Freigaben aktuell offen sind, zum Beispiel „offene Freigaben (3)“. Dort siehst Du alle Budgetpositionen, die auf Deine Entscheidung warten. Die Tabelle zeigt Kostenstelle, Gruppe, Bezeichnung, Betrag (Brutto), Kalenderjahr, den Hinweis der Gruppenleitung und das Datum der Anfrage.<\/p>\n<ul>\n  <li><strong>Freigabe:<\/strong> Ein Klick genehmigt die Position. Sie verschwindet aus Deiner Liste und erscheint im Budgetplan der Gruppe.<\/li>\n  <li><strong>Ablehnung:<\/strong> Es öffnet sich ein Fenster. Gib dort optional einen <strong>Grund<\/strong> ein und bestätige mit <strong>OK<\/strong>. Mit <strong>Abbrechen<\/strong> schließt Du das Fenster ohne Entscheidung.<\/li>\n<\/ul>\n<div class=\"callout\">\n  <p>Die Gruppenleitung sieht den Status „Abgelehnt“ und kann Deinen Grund in einem Fenster lesen. Hast Du keinen Grund eingegeben, erscheint dort ein Hinweis, dass keine Begründung eingegeben wurde. Eine Entscheidung lässt sich nicht zurücknehmen.<\/p>\n<\/div>\n<p>Zieht eine Gruppenleitung eine wartende Anfrage zurück, verschwindet sie auch aus Deiner Liste und die Zahl im Reiter sinkt.<\/p>\n\n<h3 id=\"freischaltung\">Freischaltung Budgetpläne<\/h3>\n<p>Hier bestimmst Du, für welche Kalenderjahre die Gruppenleitungen Budgetpositionen einreichen können. Zur Wahl stehen 2026, 2027 und 2028.<\/p>\n<ol>\n  <li>Öffne <strong>Budgetfreigaben<\/strong> und dann <strong>Freischaltung Budgetpläne<\/strong>.<\/li>\n  <li>Klicke beim gewünschten Jahr auf <strong>Aktivieren<\/strong>. Der Status wechselt auf „Aktiviert“.<\/li>\n  <li>Mit <strong>Deaktivieren<\/strong> sperrst Du das Jahr wieder.<\/li>\n<\/ol>\n<p>Das gilt sofort. Die Gruppenleitungen sehen nur aktivierte Jahre im Formular und im Budgetplan. Positionen, die schon eingereicht wurden, bleiben erhalten. Solange ein Jahr deaktiviert ist, siehst Du seine Zahlen im Dashboard nicht (dort steht „–“), seine offenen Freigaben erscheinen nicht, und die Gruppenleitungen sehen die Positionen nicht. Aktivierst Du das Jahr wieder, ist alles wieder da.<\/p>\n\n<h2 id=\"budgetplan\">4. Budgetplan<\/h2>\n<p>Unter <strong>Budgetplan<\/strong> verwaltest Du den Budgetplan <strong>Deiner eigenen Kostenstelle<\/strong>. Der Budgetplan hat drei Unterpunkte: <strong>Dashboard<\/strong>, <strong>Gesamtbudgetplan<\/strong> und <strong>Eingabe Budgetposition<\/strong>.<\/p>\n<ul>\n  <li><strong>Dashboard:<\/strong> Dieser Bereich ist zunächst leer und wird demnächst gefüllt.<\/li>\n  <li><strong>Gesamtbudgetplan:<\/strong> Alle freigegebenen Positionen einer Kostenstelle für ein Kalenderjahr, mit Summe. Sind mehrere Kalenderjahre freigeschaltet, schaltest Du zwischen den Jahren um.<\/li>\n  <li><strong>Eingabe Budgetposition:<\/strong> Hier legst Du Budgetpositionen an.<\/li>\n<\/ul>\n<h3>Eigene Budgetposition anlegen<\/h3>\n<p>Das Formular ist dasselbe wie bei den Gruppenleitungen: Bezeichnung, Betrag in EUR (Netto und Brutto), Kalenderjahr und Hinweistext. Netto und Brutto rechnen sich gegenseitig (Brutto = Netto × 1,19): Gib einen der beiden Beträge ein, der andere erscheint sofort. Der Unterschied: Der Button heißt <strong>Anlegen<\/strong>, und Deine Position ist <strong>sofort freigegeben<\/strong>. Sie geht nicht zur Freigabe und erscheint direkt im Gesamtbudgetplan Deiner Kostenstelle. Du kannst nur Kalenderjahre wählen, die Du unter „Freischaltung Budgetpläne“ aktiviert hast.<\/p>\n<h3>Zwischen Kostenstellen wechseln<\/h3>\n<ol>\n  <li>Wähle im Gesamtbudgetplan im Feld <strong>Kostenstelle<\/strong> eine Kostenstelle aus der Liste. Die Liste enthält alle Kostenstellen mit ihrer Gruppe, Deine eigene steht oben.<\/li>\n  <li>Die Seite zeigt sofort den Budgetplan dieser Kostenstelle. Wechselt die Seite nicht von selbst, bestätige die Auswahl mit <strong>Anzeigen<\/strong>.<\/li>\n  <li>Die Überschrift nennt die gewählte Kostenstelle, zum Beispiel „der Kostenstelle 10000003 (Gruppe Süd)“.<\/li>\n<\/ol>\n<h3>Positionen entfernen<\/h3>\n<p>Im Gesamtbudgetplan kannst Du bereits freigegebene Positionen wieder streichen. Klicke dazu in der Zeile auf den <strong>Papierkorb<\/strong>. Es öffnet sich ein Fenster.<\/p>\n<ul>\n  <li><strong>Eigene Kostenstelle:<\/strong> Eine Position, die bei Deiner eigenen Kostenstelle eingetragen ist, entfernst Du ohne Begründung mit <strong>Entfernen<\/strong>.<\/li>\n  <li><strong>Andere Kostenstelle:<\/strong> Du musst einen <strong>Grund<\/strong> angeben. Ohne Grund lässt sich die Position nicht entfernen.<\/li>\n<\/ul>\n<p>Bei einer anderen Kostenstelle erhält die Gruppenleitung eine <strong>Mitteilung<\/strong> auf ihrem Dashboard, in der die entfernte Position und Dein Grund stehen. Das Entfernen lässt sich nicht rückgängig machen.<\/p>\n<p>Den Überblick über alle Gruppen findest Du im Dashboard unter „Budgetfreigaben“.<\/p>\n\n<h2 id=\"jahresbudget\">5. Jahresbudget<\/h2>\n<p>Im Menüpunkt <strong>Jahresbudget<\/strong> werden später die Ausgaben eines Kalenderjahres als Zahlen und Diagramme zusammengefasst. Der Bereich ist noch leer. Du kannst schon jetzt oben zwischen den freigeschalteten Kalenderjahren umschalten.<\/p>\n\n<h2 id=\"upload\">6. Upload<\/h2>\n<p>Hier lädst Du später Daten hoch. Dieser Bereich wird demnächst gefüllt.<\/p>\n\n<h2 id=\"rechte\">7. Rechte erhalten und verlieren<\/h2>\n<ul>\n  <li>Die Administration kann die Abteilungsleitung auf eine andere Kostenstelle übertragen oder die Rechte entziehen.<\/li>\n  <li>Werden Dir die Rechte entzogen, endet Deine Sitzung. Du meldest Dich neu an und siehst dann die Navigation der Nutzenden.<\/li>\n  <li>Wurde Deine Kostenstelle gesperrt oder entfernt, kannst Du Dich nicht mehr anmelden.<\/li>\n<\/ul>\n<div class=\"callout\">\n  <p>Wenn Du die Rolle abgeben möchtest, wende Dich an die Administration. Du kannst die Rechte nicht selbst übertragen.<\/p>\n<\/div>\n\n<h2 id=\"gemeinsam\">8. Was Du wie alle Nutzenden tust<\/h2>\n<p>Diese Aufgaben sind im Handbuch für Nutzende beschrieben. Du findest es über die Schaltfläche <strong>Handbuch<\/strong> im Kopfbereich.<\/p>\n<ul>\n  <li>Erste Anmeldung und Passwort setzen<\/li>\n  <li>Org-Einheit und Gruppe im Profil ändern<\/li>\n  <li>Passwort ändern<\/li>\n  <li>Abmelden und automatische Abmeldung nach 30 Minuten<\/li>\n  <li>Hilfe bei Sperre oder vergessenem Passwort<\/li>\n<\/ul>\n", "file": "Budget-Dashboard-Handbuch-Abteilungsleitung.pdf"}, "admin": {"title": "Handbuch für die Administration", "short": "Administration", "html": "<p class=\"meta\">Version 2.0 · Stand Oktober 2026<\/p>\n<p>Dieses Handbuch richtet sich an die Administration. Du verwaltest die Kostenstellen, bestimmst die Abteilungsleitung, pflegst die Einstellungen und kannst Testdaten importieren.<\/p>\n\n<nav class=\"toc\" aria-label=\"Inhalt\">\n  <p>Inhalt<\/p>\n  <ol>\n    <li><a href=\"#anmelden\">Anmelden und erstes Passwort<\/a><\/li>\n    <li><a href=\"#navigation\">Die Navigation<\/a><\/li>\n    <li><a href=\"#dashboard\">Dashboard<\/a><\/li>\n    <li><a href=\"#kostenstellen\">Kostenstellen verwalten<\/a><\/li>\n    <li><a href=\"#ansicht\">Ansicht einer Kostenstelle<\/a><\/li>\n    <li><a href=\"#einstellungen\">Einstellungen<\/a><\/li>\n    <li><a href=\"#testdaten\">Testdaten<\/a><\/li>\n    <li><a href=\"#betrieb\">Sicherheit und Betrieb<\/a><\/li>\n    <li><a href=\"#probleme\">Wenn etwas nicht klappt<\/a><\/li>\n  <\/ol>\n<\/nav>\n\n<h2 id=\"anmelden\">1. Anmelden und erstes Passwort<\/h2>\n<p>Die Administration hat die feste Kostenstelle <strong>00000000<\/strong>. Das Standardpasswort ist <code>12test34<\/code>.<\/p>\n<div class=\"callout callout--warn\">\n  <p>Solange das Standardpasswort aktiv ist, zeigt jede Admin-Seite den Hinweis „Es ist noch das Standardpasswort aktiv“. Ändere das Passwort sofort unter <strong>Einstellungen<\/strong>.<\/p>\n<\/div>\n\n<h2 id=\"navigation\">2. Die Navigation<\/h2>\n<p>Die Administration hat eine eigene Navigation:<\/p>\n<table>\n  <thead><tr><th>Menüpunkt<\/th><th>Wofür er da ist<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Dashboard<\/td><td>Kennzahlen zu den Kostenstellen und die aktuelle Abteilungsleitung.<\/td><\/tr>\n    <tr><td>Kostenstellen<\/td><td>Kostenstellen anlegen, bearbeiten, freigeben und entfernen. Die Ansicht einer Kostenstelle öffnen.<\/td><\/tr>\n    <tr><td>Einstellungen<\/td><td>Titel der Anwendung, Admin-Passwort und Testdaten.<\/td><\/tr>\n    <tr><td>Abmelden<\/td><td>Sitzung beenden.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 id=\"dashboard\">3. Dashboard<\/h2>\n<p>Das Dashboard zeigt vier Kennzahlen:<\/p>\n<ul>\n  <li><strong>Kostenstellen insgesamt:<\/strong> alle angelegten Kostenstellen.<\/li>\n  <li><strong>Dürfen sich anmelden:<\/strong> die freigegebenen Kostenstellen.<\/li>\n  <li><strong>Warten auf ein Passwort:<\/strong> freigegebene Kostenstellen ohne Passwort. Sie melden sich zum ersten Mal an.<\/li>\n  <li><strong>Gerade gesperrt:<\/strong> Kostenstellen mit aktiver Sperre nach Fehlversuchen.<\/li>\n<\/ul>\n<p>Darunter steht die Kostenstelle mit den Rechten der Abteilungsleitung.<\/p>\n\n<h2 id=\"kostenstellen\">4. Kostenstellen verwalten<\/h2>\n<p>Zum Budgetplan hast Du keinen Zugriff. Die Abteilungsleitung schaltet die Kalenderjahre frei, die Gruppenleitungen tragen ihre Budgetpositionen ein. Deine Aufgabe ist es, die Kostenstellen und die Rolle der Abteilungsleitung zu pflegen.<\/p>\n<h3>Kostenstelle anlegen<\/h3>\n<ol>\n  <li>Öffne <strong>Kostenstellen<\/strong>.<\/li>\n  <li>Trage im Abschnitt <strong>Neue Kostenstelle anlegen<\/strong> die <strong>Kostenstelle<\/strong> ein: genau 8 Ziffern. Die Nummer 00000000 ist für Dich reserviert.<\/li>\n  <li>Ergänze optional die <strong>Org-Einheit<\/strong> (höchstens 11 Zeichen) und die <strong>Gruppe<\/strong> (höchstens 30 Zeichen).<\/li>\n  <li>Lass <strong>Darf sich anmelden<\/strong> angehakt, wenn die Kostenstelle sich sofort anmelden soll.<\/li>\n  <li>Hake <strong>Abteilungsleitung<\/strong> an, wenn die Kostenstelle diese Rechte erhalten soll.<\/li>\n  <li>Klicke auf <strong>Kostenstelle anlegen<\/strong>.<\/li>\n<\/ol>\n<p>Die neue Kostenstelle hat noch kein Passwort. Beim ersten Anmelden mit leerem Passwortfeld setzt die Person ihr Passwort selbst.<\/p>\n\n<h3>Kostenstelle bearbeiten<\/h3>\n<p>In der Tabelle <strong>Alle Kostenstellen<\/strong> änderst Du Org-Einheit, Gruppe und die Freigabe direkt in der Zeile. Klicke danach auf <strong>Speichern<\/strong>. Die Nutzenden können Org-Einheit und Gruppe auch selbst im Profil ändern.<\/p>\n<ul>\n  <li><strong>Anmeldung:<\/strong> Die Spalte zeigt, ob sich die Kostenstelle anmelden darf. Nimmst Du den Haken heraus, kann sich die Kostenstelle nicht mehr anmelden. Laufende Sitzungen enden.<\/li>\n<\/ul>\n\n<h3>Abteilungsleitung festlegen oder entziehen<\/h3>\n<p>Es gibt genau eine Kostenstelle mit Abteilungsleiterrechten.<\/p>\n<ul>\n  <li>Die Spalte <strong>Abteilungsleitung<\/strong> zeigt „Ja“ oder „Nein“. Klicke in der Spalte <strong>Rolle ändern<\/strong> auf <strong>Festlegen<\/strong>. Eine bisherige Abteilungsleitung verliert die Rechte.<\/li>\n  <li>Mit <strong>Entziehen<\/strong> hat danach keine Kostenstelle mehr diese Rechte.<\/li>\n  <li>Nur freigegebene Kostenstellen können die Abteilungsleitung sein.<\/li>\n<\/ul>\n\n<h3>Passwort löschen<\/h3>\n<p>Hat jemand sein Passwort vergessen, klickst Du auf <strong>Passwort löschen<\/strong> und bestätigst. Die Person meldet sich danach wie bei der ersten Anmeldung an und setzt ein neues Passwort. Laufende Sitzungen enden, und eine Sperre wird aufgehoben.<\/p>\n\n<h3>Kostenstelle entfernen<\/h3>\n<p>Mit <strong>Entfernen<\/strong> und Bestätigung löschst Du eine Kostenstelle. Auch alle Budgetpositionen dieser Kostenstelle werden gelöscht. Das lässt sich nicht rückgängig machen.<\/p>\n\n<h2 id=\"ansicht\">5. Ansicht einer Kostenstelle<\/h2>\n<p>Mit der Ansicht siehst Du die Anwendung so, wie eine Kostenstelle sie sieht. Du erkennst, welche Navigation und welche Funktionen eine Gruppenleitung oder die Abteilungsleitung hat.<\/p>\n<ol>\n  <li>Öffne <strong>Kostenstellen<\/strong>.<\/li>\n  <li>Klicke in der Zeile der Kostenstelle auf <strong>Ansicht<\/strong>. Der Button erscheint nur bei freigegebenen Kostenstellen.<\/li>\n  <li>Die Ansicht öffnet sich in einem <strong>neuen Tab<\/strong>. Dein Admin-Tab bleibt unverändert angemeldet.<\/li>\n<\/ol>\n<p>Ein orangefarbenes Band über dem Kopfbereich zeigt, welche Kostenstelle Du ansiehst. Die Navigation, die Seiten und das Handbuch entsprechen der Rolle der Kostenstelle: Gruppenleitung oder Abteilungsleitung.<\/p>\n<ul>\n  <li><strong>Nur ansehen:<\/strong> In der Ansicht kannst Du nichts speichern, freigeben, löschen oder ändern. Formulare lassen sich nicht absenden. Es erscheint ein Hinweis, dass keine Änderungen möglich sind.<\/li>\n  <li><strong>Keine Anmeldung nötig:<\/strong> Das Passwort der Kostenstelle brauchst Du nicht. Die Ansicht ändert weder Passwort noch letzte Anmeldung.<\/li>\n  <li><strong>Beenden:<\/strong> Klicke in der Navigation auf <strong>Ansicht beenden<\/strong> oder schließe den Tab. Meldest Du Dich als Administration ab, endet jede Ansicht ebenfalls.<\/li>\n  <li><strong>Mehrere Ansichten:<\/strong> Eine neue Ansicht ersetzt die vorherige im selben Browser. Du kannst gleichzeitig Dein Admin-Tab und eine Ansicht offen haben.<\/li>\n<\/ul>\n<div class=\"callout\">\n  <p>Möchtest Du Funktionen wie das Einreichen von Budgetpositionen ausprobieren, nutze die Testdaten und melde Dich mit einer Testkostenstelle an (Abschnitt 7).<\/p>\n<\/div>\n\n<h2 id=\"einstellungen\">6. Einstellungen<\/h2>\n<h3>Titel der Anwendung<\/h3>\n<p>Der Titel erscheint im Kopfbereich, in der Fußzeile und im Browser-Tab. Er darf 1 bis 60 Zeichen haben.<\/p>\n<h3>Admin-Passwort ändern<\/h3>\n<p>Gib das aktuelle Passwort und zweimal das neue ein. Es gelten dieselben Regeln wie für alle: mindestens 12 Zeichen, Groß- und Kleinbuchstaben, Ziffer und Sonderzeichen.<\/p>\n\n<h2 id=\"testdaten\">7. Testdaten<\/h2>\n<p>Unter <strong>Einstellungen<\/strong> findest Du den Abschnitt <strong>Testdaten<\/strong>. Mit den Testdaten probierst Du alle typischen Fälle der App aus, ohne selbst Kostenstellen anzulegen.<\/p>\n<h3>Testdaten importieren<\/h3>\n<ol>\n  <li>Klicke auf <strong>Testdaten importieren<\/strong>.<\/li>\n  <li>Lies die Warnung. Der Import <strong>löscht alle vorhandenen Kostenstellen<\/strong>, alle Budgetpositionen und die Festlegung der Abteilungsleitung, bevor er die Testdaten anlegt. Admin-Passwort und Titel bleiben erhalten.<\/li>\n  <li>Bestätige mit <strong>Ja, Testdaten importieren<\/strong>. Mit <strong>Abbrechen<\/strong> passiert nichts.<\/li>\n<\/ol>\n<h3>Testdaten löschen<\/h3>\n<p>Klicke auf <strong>Testdaten löschen<\/strong> und bestätige. Es werden nur die importierten Testkostenstellen mit ihren Budgetpositionen entfernt. Selbst angelegte Kostenstellen und ihre Positionen bleiben erhalten. Die Freischaltung der Kalenderjahre bleibt, wie sie ist.<\/p>\n<div class=\"callout callout--warn\">\n  <p>Importiere Testdaten nur in einer Testumgebung. Im Echtbetrieb würden sie die echten Kostenstellen löschen.<\/p>\n<\/div>\n<h3>Enthaltene Fälle<\/h3>\n<p>Alle Testkostenstellen mit gesetztem Passwort haben das Passwort <code>Test-Zugang#2026<\/code>.<\/p>\n<table>\n  <thead><tr><th>Kostenstelle<\/th><th>Fall<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>10000001<\/td><td>Abteilungsleitung mit Passwort, Navigation mit Budgetfreigaben und Upload, eigene direkt freigegebene Budgetpositionen<\/td><\/tr>\n    <tr><td>10000002<\/td><td>Gruppenleitung mit Passwort und Budgetpositionen: freigegeben (2026, 2027), wartend, abgelehnt mit und ohne Begründung, dazu eine Mitteilung über eine entfernte Position<\/td><\/tr>\n    <tr><td>10000003<\/td><td>Zweite Gruppenleitung mit Passwort: eine freigegebene und zwei wartende Positionen für die Freigaben der Abteilungsleitung<\/td><\/tr>\n    <tr><td>10000004<\/td><td>Erste Anmeldung: noch kein Passwort, Dialog zum Setzen<\/td><\/tr>\n    <tr><td>10000005<\/td><td>Passwort gelöscht, Org-Einheit und Gruppe leer (im Profil ergänzen)<\/td><\/tr>\n    <tr><td>10000006<\/td><td>Gesperrt nach Fehlversuchen (15 Minuten ab Import)<\/td><\/tr>\n    <tr><td>10000007<\/td><td>Nicht freigegeben: Anmeldung nicht erlaubt<\/td><\/tr>\n    <tr><td>10000008<\/td><td>Org-Einheit und Gruppe in maximaler Länge (11 und 30 Zeichen)<\/td><\/tr>\n    <tr><td>Kalenderjahre<\/td><td>2026 und 2027 sind für Budgetpläne freigeschaltet, 2028 ist gesperrt<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 id=\"betrieb\">8. Sicherheit und Betrieb<\/h2>\n<ul>\n  <li><strong>Sperre:<\/strong> Nach 5 Fehlversuchen ist eine Kostenstelle 15 Minuten gesperrt. Die Sperre siehst Du in der Tabelle der Kostenstellen.<\/li>\n  <li><strong>Sitzung:<\/strong> Nach 30 Minuten ohne Aktivität werden Nutzende abgemeldet.<\/li>\n  <li><strong>Datenhaltung:<\/strong> Alle Daten liegen in der Datei <code>App_Data/data.json<\/code> auf dem Server, zusammen mit der Sicherung <code>data.json.bak<\/code>. Nimm diesen Ordner in die Datensicherung auf.<\/li>\n  <li><strong>HTTPS:<\/strong> Die Anwendung läuft auch über HTTP. Über HTTP gehen Passwörter unverschlüsselt durchs Netz. Nutze HTTPS, wenn das Netz nicht vertrauenswürdig ist, und setze dann <code>Security:RequireHttps<\/code> auf <code>true<\/code>.<\/li>\n  <li><strong>Betrieb auf dem IIS:<\/strong> Die Schritte zur Bereitstellung stehen in der README des Projekts.<\/li>\n<\/ul>\n\n<h2 id=\"probleme\">9. Wenn etwas nicht klappt<\/h2>\n<table>\n  <thead><tr><th>Situation<\/th><th>Was Du tun kannst<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Jemand kann sich nicht anmelden<\/td><td>Prüfe unter Kostenstellen, ob in der Spalte <strong>Anmeldung<\/strong> angehakt ist und ob eine Sperre besteht. Löse eine Sperre mit <strong>Passwort löschen<\/strong>.<\/td><\/tr>\n    <tr><td>Passwort vergessen<\/td><td>Klicke bei der Kostenstelle auf <strong>Passwort löschen<\/strong>.<\/td><\/tr>\n    <tr><td>Admin-Passwort vergessen<\/td><td>Stoppe die Anwendung, benenne <code>App_Data/data.json<\/code> um und starte sie neu. Die Anwendung legt dann einen neuen Datenbestand mit dem Standardpasswort an. Die alten Kostenstellen stehen danach nicht mehr zur Verfügung.<\/td><\/tr>\n    <tr><td>Der Button „Ansicht“ fehlt<\/td><td>Die Kostenstelle ist nicht freigegeben. Hake in der Spalte „Anmeldung“ den Haken an und speichere.<\/td><\/tr>\n    <tr><td>Die Ansicht endet plötzlich<\/td><td>Du wurdest als Administration abgemeldet oder die Sitzung ist nach 30 Minuten ohne Aktivität abgelaufen. Melde Dich an und öffne die Ansicht neu.<\/td><\/tr>\n    <tr><td>Anwendung speichert nicht<\/td><td>Prüfe, ob das Konto des Anwendungspools Schreibrechte auf <code>App_Data<\/code> hat.<\/td><\/tr>\n  <\/tbody>\n<\/table>\n", "file": "Budget-Dashboard-Handbuch-Administration.pdf"}};

    if (!(await verifyPw(cur, c.hash))) { failCount(c); return fail(["Das aktuelle Passwort stimmt nicht."], kind); }
    var e = policy(a, n);
    if (a !== b) e.push("Die beiden neuen Passwörter stimmen nicht überein.");
    if (a === cur) e.push("Das neue Passwort muss sich vom aktuellen unterscheiden.");
    if (e.length) return fail(e, kind);
    c.hash = await hashPw(a); c.failed = 0; if (n === ADMIN) c.must = false;
    done(okMsg, kind);
  }

  async function exportPdf() {
    var m = MANUALS[manualKey], bin = atob(PDFS[manualKey]), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    try { await dl.save({ filename: m.file, data: u.buffer }); pdfMsg = "Das Handbuch wurde als PDF gespeichert."; }
    catch (e) { pdfMsg = e && e.code === "declined" ? "Der Export wurde abgebrochen." : "Der PDF-Export ist hier nicht möglich."; }
    render(); setTimeout(function () { pdfMsg = ""; }, 100);
  }

  function ask(text, yes) {
    var d = document.createElement("div"); d.className = "modal";
    d.innerHTML = '<div class="modal__box card" role="alertdialog" aria-modal="true" aria-labelledby="mt"><p id="mt" class="copy">' + esc(text) + '</p><div class="actions"><button class="btn btn--primary" data-m="y">Ja, bestätigen</button><button class="btn btn--ghost" data-m="n">Abbrechen</button></div></div>';
    document.body.appendChild(d);
    d.querySelector('[data-m="n"]').focus();
    d.addEventListener("click", function (e) { var m = e.target.getAttribute && e.target.getAttribute("data-m"); if (m || e.target === d) { d.remove(); if (m === "y") yes(); } });
    d.addEventListener("keydown", function (e) { if (e.key === "Escape") d.remove(); });
  }

  document.addEventListener("input", function (e) {
    var t = e.target; if (!t || (t.id !== "netto" && t.id !== "betrag")) return;
    var c = parseAmt(t.value), other = $(t.id === "netto" ? "#betrag" : "#netto");
    if (other) other.value = c === null ? "" : fmt(t.id === "netto" ? Math.floor((c * 119 + 50) / 100) : Math.floor((c * 100 + 59) / 119));
  });
  document.addEventListener("focusout", function (e) { var t = e.target; if (t && (t.id === "netto" || t.id === "betrag")) { var c = parseAmt(t.value); if (c !== null) t.value = fmt(c); } });
  document.addEventListener("change", function (e) { if (e.target && e.target.id === "ks" && session && session.role === "Abteilungsleiter") { planKs = e.target.value === session.number ? null : e.target.value; render(); } });
  document.addEventListener("submit", function (e) { var f = e.target.getAttribute("data-form"); if (f && forms[f]) { e.preventDefault(); if (session && session.view) return viewBlocked(); forms[f](new FormData(e.target)); } });
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-go],[data-act]") : null; if (!t) return;
    if (t.id === "reset-demo") { return ask("Alle Demo-Daten zurücksetzen? Kostenstellen, Passwörter und Einstellungen gehen verloren.", async function () { data = await seed(); session = null; pending = null; route = "login"; draft = {}; save(); render(); }); }
    if (t.hasAttribute("data-go")) { e.preventDefault(); return go(t.getAttribute("data-go")); }
    var act = t.getAttribute("data-act"), n = t.getAttribute("data-n");
    if (session && session.view && act && ["manual", "year", "reason", "logout", "pdf"].indexOf(act) < 0) return viewBlocked();
    if (act === "askimport") return ask("Beim Import werden alle vorhandenen Kostenstellen gelöscht, auch die Festlegung der Abteilungsleitung. Das lässt sich nicht rückgängig machen. Admin-Passwort und Titel bleiben erhalten. Testdaten jetzt importieren?", async function () { var k = await importTestData(); done("Die Testdaten sind importiert (" + k + " Kostenstellen). Alle vorherigen Kostenstellen sind gelöscht."); });
    if (act === "askdelete") return ask("Alle Testkostenstellen werden gelöscht. Selbst angelegte Kostenstellen bleiben erhalten. Testdaten jetzt löschen?", function () { var k = data.ccs.filter(function (c) { return c.test; }).length; data.ccs = data.ccs.filter(function (c) { return !c.test; }); data.items = data.items.filter(function (i) { return !i.test && find(i.cc); }); data.notes = data.notes.filter(function (x) { return !x.test && find(x.cc); }); if (data.head && !find(data.head)) data.head = null; done(k + " Testkostenstellen sind gelöscht."); });
    if (act === "ksgo") { var sel = $("#ks"); if (sel) { planKs = sel.value === session.number ? null : sel.value; render(); } return; }
    if (act === "jyear") { budgetYear = parseInt(n, 10); return render(); }
    if (act === "dismiss") { data.notes = data.notes.filter(function (x) { return !(x.id === n && x.cc === session.number); }); save(); return render(); }
    if (act === "rm") {
      var ri2 = data.items.find(function (x) { return x.id === n && x.status === "approved"; }); if (!ri2) return fail(["Die Position gibt es nicht mehr."]);
      var own2 = ri2.cc === session.number;
      return askRemove(ri2, own2, function (reasonText) {
        data.items = data.items.filter(function (x) { return x !== ri2; });
        if (!own2) data.notes.push({ id: "n" + Date.now() + Math.floor(Math.random() * 1000), cc: ri2.cc, title: "Budgetposition entfernt", message: "Die Abteilungsleitung hat die freigegebene Budgetposition „" + ri2.name + "“ (" + fmt(ri2.cents) + " EUR (Brutto), " + ri2.year + ") entfernt. Grund: " + reasonText, created: Date.now() });
        done(own2 ? "Die Budgetposition ist entfernt." : "Die Budgetposition ist entfernt. Die Gruppenleitung erhält eine Mitteilung mit Deinem Grund.");
      });
    }
    if (act === "year") { planYear = parseInt(n, 10); return render(); }
    if (act === "bdel") { var bi = data.items.find(function (x) { return x.id === n && x.cc === session.number; }); if (!bi) return fail(["Den Eintrag gibt es nicht mehr."]); if (bi.status === "approved") return fail(["Freigegebene Positionen lassen sich nicht löschen."]); data.items = data.items.filter(function (x) { return x !== bi; }); return done("Der Eintrag ist gelöscht."); }
    if (act === "reason") { var ri = data.items.find(function (x) { return x.id === n; }); return inform("Grund der Ablehnung", ri && ri.reason ? ri.reason : "Es wurde keine Begründung eingegeben."); }
    if (act === "bapprove") { var ai = data.items.find(function (x) { return x.id === n && x.status === "pending"; }); if (!ai) return fail(["Die Position wartet nicht mehr auf Freigabe."]); ai.status = "approved"; ai.decided = Date.now(); return done("Die Budgetposition ist freigegeben."); }
    if (act === "breject") { var ji = data.items.find(function (x) { return x.id === n && x.status === "pending"; }); if (!ji) return fail(["Die Position wartet nicht mehr auf Freigabe."]); return askReason(ji, function (v) { ji.status = "rejected"; ji.reason = v || null; ji.decided = Date.now(); done("Die Budgetposition ist abgelehnt."); }); }
    if (act === "byear") { var y = parseInt(n, 10), on = t.getAttribute("data-v") === "1"; data.years = data.years.filter(function (x) { return x !== y; }); if (on) data.years.push(y); return done(on ? "Budgetpläne für " + y + " sind aktiviert." : "Budgetpläne für " + y + " sind deaktiviert."); }
    if (act === "pdf") { return exportPdf(); }
    if (act === "manual") { manualKey = n; pdfMsg = ""; return render(); }
    if (act === "logout") { if (session && session.view) { session = adminSession; adminSession = null; return go("Kostenstellen"); } session = null; route = "login"; return go("login"); }
    if (act === "viewas") { var vc = find(n); if (!vc || !vc.enabled) return fail(["Für diese Kostenstelle ist keine Ansicht möglich. Sie muss freigegeben sein."]); adminSession = session; session = { number: n, role: roleOf(n), view: true }; manualKey = null; planYear = null; planKs = null; bdraft = {}; return go("Dashboard"); }
    if (act === "cancelset") { pending = null; return go("login"); }
    if (act === "save") {
      var o = $('[data-org="' + n + '"]').value.trim(), g = $('[data-group="' + n + '"]').value.trim(), en = $('[data-en="' + n + '"]').checked, e2 = checkText(o, g);
      if (e2.length) return fail(e2);
      var c = find(n); c.org = o; c.group = g; c.enabled = en; if (!en && data.head === n) data.head = null;
      return done("Kostenstelle " + n + " ist gespeichert.");
    }
    if (act === "head") { data.head = t.getAttribute("data-v") === "1" ? n : null; return done(data.head ? "Kostenstelle " + n + " hat jetzt Abteilungsleiterrechte." : "Kostenstelle " + n + " hat keine Abteilungsleiterrechte mehr."); }
    if (act === "reset") return ask("Passwort der Kostenstelle " + n + " löschen? Bei der nächsten Anmeldung muss ein neues Passwort gesetzt werden.", function () { var c = find(n); c.hash = null; c.failed = 0; c.lock = 0; done("Das Passwort der Kostenstelle " + n + " ist gelöscht. Beim nächsten Anmelden wird ein neues gesetzt."); });
    if (act === "del") return ask("Kostenstelle " + n + " entfernen?", function () { data.ccs = data.ccs.filter(function (x) { return x.number !== n; }); data.items = data.items.filter(function (i) { return i.cc !== n; }); data.notes = data.notes.filter(function (x) { return x.cc !== n; }); if (data.head === n) data.head = null; done("Kostenstelle " + n + " ist entfernt."); });
  });

  (async function init() {
    data = load();
    if (!data || !data.admin) { data = await seed(); save(); }
    data.years = data.years || []; data.items = data.items || []; data.notes = data.notes || [];
    document.title = data.title;
    try { if (window.claude && window.claude.use) { var d0 = await window.claude.use("downloads"); if (d0) { dl = d0; } } } catch (e) {}
    render();
  })();
})();

</script>
